pack:
  id: cordon.composites
  version: 0.1.0
  license: Apache-2.0
  source: cordon-builtin
  description: >
    Behavioural rules written against capability primitives rather than against
    any language's syntax. Because the primitives are supplied per language as
    data, every rule in this pack applies to every language that defines them.
    Adding a language inherits this whole pack unchanged.

    These rules carry no `languages` field for that reason: they are not about
    JavaScript or Python, they are about what code is doing.

rules:
  # ---------------------------------------------------------------------
  # Second-stage loaders
  # ---------------------------------------------------------------------
  - id: SUSPECT.DECODE_EXEC.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Encoded data decoded and executed in the same file
    message: >
      This file decodes a string and passes the result to a dynamic-execution
      primitive. That pairing is the standard second-stage loader: the payload
      is not present as code until runtime, so it cannot be read in a diff and
      does not appear in any review.
    remediation: >
      Remove the dynamic execution. If data must be decoded, decode it into a
      value that is used as data. Code should not arrive as a string.
    references:
      - https://cwe.mitre.org/data/definitions/95.html
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - capability: decode
        - any:
            - capability: execute
            - capability: spawn

  # ---------------------------------------------------------------------
  # Exfiltration
  # ---------------------------------------------------------------------
  - id: SUSPECT.EXFIL.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Credential access combined with network egress and execution
    message: >
      This file reads credentials or the environment, opens an outbound
      connection, and runs code or a process. Any one of those is ordinary.
      All three together is the shape of an exfiltrator, and no legitimate
      component needs the combination in a single file.
    remediation: >
      Separate the concerns. Configuration reading, network calls and process
      execution belong in different modules, where each can be reviewed for what
      it does rather than for what it could be combined into.
    evidence_policy: hash_only
    match:
      kind: composite
      scope: file
      all:
        - capability: credential
        - capability: egress
        - any:
            - capability: execute
            - capability: spawn

  # ---------------------------------------------------------------------
  # Droppers
  # ---------------------------------------------------------------------
  - id: SUSPECT.DROPPER.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Content fetched from the network and executed
    message: >
      This file retrieves something over the network and executes it. The code
      that ends up running is whatever the remote host chose to serve at that
      moment, so nothing about it is captured by review, by the lockfile, or by
      any artefact this repository controls.
    remediation: >
      Fetch and execute must not be adjacent. Vendor the dependency, pin it by
      digest, and verify it before anything runs.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - capability: egress
        - any:
            - capability: execute
            - capability: spawn
        # A third signal is required, and this is the whole rule.
        #
        # `egress AND (execute OR spawn)` describes an enormous amount of
        # ordinary operations code: a deploy script that pushes and posts to
        # Slack, a health check that runs systemctl and pings a status page, a
        # sync job that rsyncs and calls a webhook. All three were reported
        # `high` as "content fetched from the network and executed", which none
        # of them does -- nothing in the pair required the thing executed to be
        # the thing fetched.
        #
        # At `high`, inside the default failure gate, that breaks honest builds.
        # A scanner that cries wolf on the first day gets switched off, and a
        # switched-off scanner catches nothing at all -- so a false positive
        # here costs more than the finding is worth.
        #
        # A real dropper decodes what it fetched, or runs at install time.
        # Requiring one of those keeps every malicious sample and drops the
        # benign ones.
        - any:
            - capability: decode
            - capability: fetch_exec
            - context: install_hook
      unless:
        # Test files legitimately fetch fixtures and run assertions in the same
        # place. Scoped by path rather than by rule so this remains a narrow
        # exception rather than a directory-shaped hole.
        - path_glob: "**/*.test.*"
        - path_glob: "**/*.spec.*"
        - path_glob: "**/test_*.py"
        - path_glob: "tests/**"

  # ---------------------------------------------------------------------
  # Persistence
  # ---------------------------------------------------------------------
  - id: SUSPECT.PERSIST.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Network access combined with a persistence mechanism
    message: >
      This file reaches the network and writes to a location that survives a
      restart, such as a shell profile, scheduled task or service definition.
      That combination is how fetched code arranges to keep running after the
      process that installed it has exited.
    remediation: >
      Confirm this is a deliberate installer action and that what is written is
      fixed content rather than anything retrieved at runtime.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - capability: persist
        - any:
            - capability: egress
            - capability: decode

  # ---------------------------------------------------------------------
  # Install-time rules
  #
  # These require no execution primitive, and that is the point. In
  # application code, reading configuration and calling an API is what a
  # program does all day, so the pair needs a third signal before it means
  # anything. In an install hook it does not: the hook is the execution. The
  # code runs unprompted, as the developer, with the developer's full
  # environment, before any test, review, container boundary or network
  # policy has had a chance to apply.
  #
  # These are the rules that catch the shape of a real supply-chain
  # compromise, so they are `malicious` rather than `suspicious` and carry
  # provenance accordingly.
  # ---------------------------------------------------------------------
  - id: MALWARE.EXFIL.001
    version: 1.0.0
    category: malicious
    severity: critical
    confidence: high
    title: Install script reads credentials and transmits them
    message: >
      This install or build script reads credentials or the environment and
      opens an outbound connection. It executes automatically on every install,
      as the user running it, with access to that user's SSH keys, cloud
      credentials and registry publish tokens. Nothing about it requires the
      developer to run the project.
    remediation: >
      Treat the host as compromised. Do not run install or build scripts from
      this package. Rotate every credential reachable from the affected machine,
      starting with registry publish tokens, and report the package to the
      registry.
    provenance:
      kind: research
      reference: >
        The standard credential-harvesting shape used by published package
        compromises across npm, PyPI and RubyGems.
    evidence_policy: hash_only
    references:
      - https://cwe.mitre.org/data/definitions/522.html
    match:
      kind: composite
      scope: file
      all:
        - context: install_hook
        - capability: credential
        - capability: egress

  - id: MALWARE.DROPPER.001
    version: 1.0.0
    category: malicious
    severity: critical
    confidence: high
    title: Install script fetches and executes remote content
    message: >
      This install or build script retrieves content over the network and runs
      it. What executes is whatever the remote host chooses to serve at install
      time, so it is not pinned by the lockfile, not captured by review, and not
      reproducible. The package that was audited and the code that runs are not
      the same thing.
    remediation: >
      Treat the host as compromised. Do not run install or build scripts from
      this package. Rotate credentials reachable from the affected machine and
      report the package to the registry.
    provenance:
      kind: research
      reference: >
        The fetch-and-execute install hook, the most common initial stage in
        published registry compromises.
    evidence_policy: masked
    references:
      - https://cwe.mitre.org/data/definitions/494.html
    match:
      kind: composite
      scope: file
      all:
        - context: install_hook
        - capability: egress
        - any:
            - capability: spawn
            - capability: execute

  # ---------------------------------------------------------------------
  # Dispatch that could not be resolved
  # ---------------------------------------------------------------------
  - id: SUSPECT.DYNAMIC_DISPATCH.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: A function is reached by a name computed at runtime
    message: >
      This file calls something through a name it builds while running, into a
      namespace where that has no ordinary purpose, and it also decodes data,
      reaches the network, or reads credentials. The combination is what makes
      it worth reporting: the name is unavailable to any reader of the source,
      and the reason to make it unavailable is that reading it would be
      informative.
    remediation: >
      Call the function by its name. If the indirection is genuinely required,
      restrict it to a table of permitted targets defined in the file, so a
      reader can see the whole set of things that can run.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - capability: dynamic_dispatch
        - any:
            - capability: decode
            - capability: egress
            - capability: credential
      unless:
        - path_glob: "**/*.test.*"
        - path_glob: "**/test_*.py"
        - path_glob: "tests/**"

  - id: MALWARE.DYNAMIC_DISPATCH.001
    version: 1.0.0
    category: malicious
    severity: critical
    confidence: high
    title: Install-time code reaches a function by a computed name
    message: >
      An install script calls something through a name assembled at runtime.
      Install-time code runs unprompted, as the user, with their full
      environment, before any test or review applies -- and this one is written
      so that what it calls cannot be read from the file. There is no build
      that needs that.
    remediation: >
      Treat the package as hostile. Do not install it, and rotate any credential
      reachable from a machine that already did.
    provenance:
      kind: research
      reference: reviews/2026-09-09-detection-evasion-and-noise.md
      note: >
        Written for the evasion class an adversarial audit demonstrated: import
        aliasing, indirect calls and computed dispatch took five install-hook
        exfiltration payloads from critical to no finding at all. The AST tier
        resolves what is constant-derivable; this rule is what the attacker is
        forced into when it is not.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - context: install_hook
        - capability: dynamic_dispatch
