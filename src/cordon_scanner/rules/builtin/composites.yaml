pack:
  id: cordon.composites
  version: 0.1.0
  license: Apache-2.0
  source: cordon-builtin
  description: >
    Behavioural rules written against capability primitives rather than against
    any language's syntax. Because the primitives are supplied per language as
    data, every rule in this pack applies to every language that defines them.
    Adding a language inherits this whole pack unchanged.

    These rules carry no `languages` field for that reason: they are not about
    JavaScript or Python, they are about what code is doing.

rules:
  # ---------------------------------------------------------------------
  # Second-stage loaders
  # ---------------------------------------------------------------------
  - id: SUSPECT.DECODE_EXEC.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Encoded data decoded and executed in the same file
    message: >
      This file decodes a string and passes the result to a dynamic-execution
      primitive. That pairing is the standard second-stage loader: the payload
      is not present as code until runtime, so it cannot be read in a diff and
      does not appear in any review.
    remediation: >
      Remove the dynamic execution. If data must be decoded, decode it into a
      value that is used as data. Code should not arrive as a string.
    references:
      - https://cwe.mitre.org/data/definitions/95.html
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - capability: decode
        - any:
            - capability: execute
            - capability: spawn

  # ---------------------------------------------------------------------
  # Exfiltration
  # ---------------------------------------------------------------------
  - id: SUSPECT.EXFIL.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Credential access combined with network egress and execution
    message: >
      This file reads credentials or the environment, opens an outbound
      connection, and runs code or a process. Any one of those is ordinary.
      All three together is the shape of an exfiltrator, and no legitimate
      component needs the combination in a single file.
    remediation: >
      Separate the concerns. Configuration reading, network calls and process
      execution belong in different modules, where each can be reviewed for what
      it does rather than for what it could be combined into.
    evidence_policy: hash_only
    match:
      kind: composite
      scope: file
      all:
        - capability: credential
        - capability: egress
        - any:
            - capability: execute
            - capability: spawn

  # ---------------------------------------------------------------------
  # Droppers
  # ---------------------------------------------------------------------
  - id: SUSPECT.DROPPER.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Content fetched from the network and executed
    message: >
      This file retrieves something over the network and executes it. The code
      that ends up running is whatever the remote host chose to serve at that
      moment, so nothing about it is captured by review, by the lockfile, or by
      any artefact this repository controls.
    remediation: >
      Fetch and execute must not be adjacent. Vendor the dependency, pin it by
      digest, and verify it before anything runs.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - capability: egress
        - any:
            - capability: execute
            - capability: spawn
        # A third signal is required, and this is the whole rule.
        #
        # `egress AND (execute OR spawn)` describes an enormous amount of
        # ordinary operations code: a deploy script that pushes and posts to
        # Slack, a health check that runs systemctl and pings a status page, a
        # sync job that rsyncs and calls a webhook. All three were reported
        # `high` as "content fetched from the network and executed", which none
        # of them does -- nothing in the pair required the thing executed to be
        # the thing fetched.
        #
        # At `high`, inside the default failure gate, that breaks honest builds.
        # A scanner that cries wolf on the first day gets switched off, and a
        # switched-off scanner catches nothing at all -- so a false positive
        # here costs more than the finding is worth.
        #
        # A real dropper decodes what it fetched, or runs at install time.
        # Requiring one of those keeps every malicious sample and drops the
        # benign ones.
        - any:
            - capability: decode
            - capability: fetch_exec
            - context: install_hook
      unless:
        # Test files legitimately fetch fixtures and run assertions in the same
        # place. Scoped by path rather than by rule so this remains a narrow
        # exception rather than a directory-shaped hole.
        - path_glob: "**/*.test.*"
        - path_glob: "**/*.spec.*"
        - path_glob: "**/test_*.py"
        - path_glob: "tests/**"

  # ---------------------------------------------------------------------
  # Persistence
  # ---------------------------------------------------------------------
  - id: SUSPECT.PERSIST.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Network access combined with a persistence mechanism
    message: >
      This file reaches the network and writes to a location that survives a
      restart, such as a shell profile, scheduled task or service definition.
      That combination is how fetched code arranges to keep running after the
      process that installed it has exited.
    remediation: >
      Confirm this is a deliberate installer action and that what is written is
      fixed content rather than anything retrieved at runtime.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - capability: persist
        - any:
            - capability: egress
            - capability: decode

  # ---------------------------------------------------------------------
  # Install-time rules
  #
  # These require no execution primitive, and that is the point. In
  # application code, reading configuration and calling an API is what a
  # program does all day, so the pair needs a third signal before it means
  # anything. In an install hook it does not: the hook is the execution. The
  # code runs unprompted, as the developer, with the developer's full
  # environment, before any test, review, container boundary or network
  # policy has had a chance to apply.
  #
  # These are the rules that catch the shape of a real supply-chain
  # compromise, so they are `malicious` rather than `suspicious` and carry
  # provenance accordingly.
  # ---------------------------------------------------------------------
  - id: MALWARE.EXFIL.001
    version: 1.0.0
    category: malicious
    severity: critical
    confidence: high
    title: Install script reads credentials and transmits them
    message: >
      This install or build script reads credentials or the environment and
      opens an outbound connection. It executes automatically on every install,
      as the user running it, with access to that user's SSH keys, cloud
      credentials and registry publish tokens. Nothing about it requires the
      developer to run the project.
    remediation: >
      Treat the host as compromised. Do not run install or build scripts from
      this package. Rotate every credential reachable from the affected machine,
      starting with registry publish tokens, and report the package to the
      registry.
    provenance:
      kind: research
      reference: >
        The standard credential-harvesting shape used by published package
        compromises across npm, PyPI and RubyGems.
    evidence_policy: hash_only
    references:
      - https://cwe.mitre.org/data/definitions/522.html
    match:
      kind: composite
      scope: file
      all:
        - context: install_hook
        - capability: credential
        - capability: egress

  - id: MALWARE.DROPPER.001
    version: 1.0.0
    category: malicious
    severity: critical
    confidence: high
    title: Install script fetches and executes remote content
    message: >
      This install or build script retrieves content over the network and runs
      it. What executes is whatever the remote host chooses to serve at install
      time, so it is not pinned by the lockfile, not captured by review, and not
      reproducible. The package that was audited and the code that runs are not
      the same thing.
    remediation: >
      Treat the host as compromised. Do not run install or build scripts from
      this package. Rotate credentials reachable from the affected machine and
      report the package to the registry.
    provenance:
      kind: research
      reference: >
        The fetch-and-execute install hook, the most common initial stage in
        published registry compromises.
    evidence_policy: masked
    references:
      - https://cwe.mitre.org/data/definitions/494.html
    match:
      kind: composite
      scope: file
      all:
        - context: install_hook
        - capability: egress
        - any:
            - capability: spawn
            - capability: execute

  # ---------------------------------------------------------------------
  # Dispatch that could not be resolved
  # ---------------------------------------------------------------------
  - id: SUSPECT.DYNAMIC_DISPATCH.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: A function is reached by a name computed at runtime
    message: >
      This file calls something through a name it builds while running, into a
      namespace where that has no ordinary purpose, and it also decodes data,
      reaches the network, or reads credentials. The combination is what makes
      it worth reporting: the name is unavailable to any reader of the source,
      and the reason to make it unavailable is that reading it would be
      informative.
    remediation: >
      Call the function by its name. If the indirection is genuinely required,
      restrict it to a table of permitted targets defined in the file, so a
      reader can see the whole set of things that can run.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - capability: dynamic_dispatch
        # Credential access was a co-signal here and is not one. `os.environ`
        # appears in a large share of all Python, and pairing it with
        # `globals()[name]` -- the ordinary lazy-attribute idiom -- reported
        # click, Flask and PyYAML as suspicious. Decoding or reaching the
        # network alongside a computed target is the combination that has no
        # benign reading; reading an environment variable is not.
        - any:
            - capability: decode
            - capability: egress
      unless:
        - path_glob: "**/*.test.*"
        - path_glob: "**/test_*.py"
        - path_glob: "tests/**"

  - id: MALWARE.DYNAMIC_DISPATCH.001
    version: 1.0.0
    category: malicious
    severity: critical
    confidence: high
    title: Install-time code reaches a function by a computed name
    message: >
      An install script calls something through a name assembled at runtime.
      Install-time code runs unprompted, as the user, with their full
      environment, before any test or review applies -- and this one is written
      so that what it calls cannot be read from the file. There is no build
      that needs that.
    remediation: >
      Treat the package as hostile. Do not install it, and rotate any credential
      reachable from a machine that already did.
    provenance:
      kind: research
      reference: reviews/2026-09-09-detection-evasion-and-noise.md
      note: >
        Written for the evasion class an adversarial audit demonstrated: import
        aliasing, indirect calls and computed dispatch took five install-hook
        exfiltration payloads from critical to no finding at all. The AST tier
        resolves what is constant-derivable; this rule is what the attacker is
        forced into when it is not.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - context: install_hook
        - capability: dynamic_dispatch

  # ---------------------------------------------------------------------
  # Cryptomining
  # ---------------------------------------------------------------------
  - id: SUSPECT.CRYPTOMINER.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: high
    title: Cryptocurrency mining
    message: >
      This file references a mining pool protocol, a pool host or a miner
      binary. Unlike most signals in this tool that is close to conclusive on
      its own: the stratum protocol exists for mining and nothing else, and a
      named miner in a project that is not a mining client did not arrive by
      accident.
    remediation: >
      If this project is not a mining client, treat the code as an implant.
      Review how it entered the tree and what else the same change brought.
    references:
      - https://attack.mitre.org/techniques/T1496/
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - capability: mine

  - id: MALWARE.CRYPTOMINER.001
    version: 1.0.0
    category: malicious
    severity: critical
    confidence: high
    title: Install-time cryptocurrency mining
    message: >
      An install or build script starts mining. It runs unprompted, as the
      user, on every machine that installs the package and on every CI runner
      that builds it, spending compute the owner is paying for.
    remediation: >
      Treat the package as hostile. Do not install it, and check for the miner
      still running on machines that already did.
    references:
      - https://attack.mitre.org/techniques/T1496/
    provenance:
      kind: research
      reference: reviews/2026-09-09-implementation-plan.md
      note: >
        Domain 6 of the coverage taxonomy. Mining was the one malware class the
        capability model could describe but no pack supplied primitives for.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - context: install_hook
        - capability: mine

  # ---------------------------------------------------------------------
  # Anti-analysis
  # ---------------------------------------------------------------------
  - id: SUSPECT.ANTI_ANALYSIS.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Behaviour gated on whether it is being observed
    message: >
      This file checks for a sandbox, a debugger, a CI environment or waits out
      a long delay, and it also decodes data, spawns a process or reaches the
      network. Each half has innocent uses. Together they describe code whose
      payload is conditional on not being watched, and an ordinary program has
      no reason to care whether it is.
    remediation: >
      Review what the check guards. If behaviour genuinely must differ by
      environment, make the difference explicit and documented; if it guards a
      payload, the payload is the finding.
    references:
      - https://attack.mitre.org/techniques/T1497/
    provenance:
      kind: research
      reference: reviews/2026-09-09-implementation-plan.md
      note: >
        Domain 7. This is also the static counterpart to what a sandbox cannot
        see: a payload that sleeps past an analysis window defeats dynamic
        observation and lights this up instead, so the two tiers cover each
        other.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - capability: anti_analysis
        - any:
            - capability: decode
            - capability: egress
            - capability: spawn
      unless:
        - path_glob: "**/*.test.*"
        - path_glob: "**/test_*.py"
        - path_glob: "tests/**"
        - path_glob: "**/conftest.py"

  - id: MALWARE.ANTI_ANALYSIS.001
    version: 1.0.0
    category: malicious
    severity: critical
    confidence: high
    title: Install-time code that checks whether it is being watched
    message: >
      An install script tests for an analysis environment before acting. There
      is no build step that needs to know whether it is in a sandbox. The check
      exists so the package behaves differently where it would be observed than
      where it would not.
    remediation: >
      Treat the package as hostile. Do not install it, and rotate any credential
      reachable from a machine that already did.
    provenance:
      kind: research
      reference: reviews/2026-09-09-implementation-plan.md
      note: >
        Domain 7, install-time. The environment check is the evidence: a build
        that legitimately varies by platform tests the platform, not the
        presence of a debugger or a CI marker before running a payload.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - context: install_hook
        - capability: anti_analysis
        - any:
            - capability: decode
            - capability: egress
            - capability: spawn

  - id: SUSPECT.DECODE_CHAIN.001
    version: 1.0.0
    category: suspicious
    severity: critical
    confidence: high
    title: A payload decoded in several stages, then executed
    message: >
      This file applies more than one decoding step before executing the
      result -- base64 into decompression, hex into exclusive-or, or similar.
      One decode has ordinary uses. Stacking them has none: each layer exists
      only to make the payload unrecognisable to whatever inspected the layer
      above, which is a statement about wanting to defeat inspection.
    remediation: >
      Treat the payload as hostile until it has been decoded by hand and read.
      Nothing legitimate needs its code to arrive through two encodings.
    references:
      - https://attack.mitre.org/techniques/T1027/
    provenance:
      kind: research
      reference: reviews/2026-09-09-implementation-plan.md
      note: >
        Domain 7. Depth is the signal the flat capability model could not
        express: `decode AND execute` fires the same way for one layer as for
        four, so the strongest cases were reported at the weakest rule's
        severity.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - capability: decode
          at_least: 2
        - any:
            - capability: execute
            - capability: spawn

  # ---------------------------------------------------------------------
  # Exfiltration channels
  # ---------------------------------------------------------------------
  - id: SUSPECT.EXFIL.DNS.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Credential access and a hostname assembled for resolution
    message: >
      This file reads credentials or the environment and resolves a hostname it
      builds at runtime. DNS is the channel that survives environments where
      nothing else gets out: the query leaves through the resolver the host
      already trusts, and a firewall rule that permits name resolution cannot
      distinguish data in a label from an ordinary lookup.
    remediation: >
      Resolve names that appear in source or configuration. If this is a health
      check, the hostname does not need to contain program data.
    references:
      - https://attack.mitre.org/techniques/T1048/003/
    provenance:
      kind: research
      reference: reviews/2026-09-09-implementation-plan.md
      note: >
        Domain 9. DNS was the one exfiltration channel the egress patterns did
        not model at all, and it is the one that works where the others are
        blocked.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - rule: CAP.EGRESS.DNS_CONSTRUCTED.001
        - capability: credential

  - id: SUSPECT.EXFIL.DROP_POINT.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Credential access and a request to a drop point
    message: >
      This file reads credentials or the environment and contacts a chat
      webhook, an anonymous paste service, or an out-of-band interaction host.
      Two signals rather than the usual three, because the destination is
      itself the third: a webhook ingest needs no account and no
      infrastructure, which is why it is the most common exfiltration endpoint
      in published incidents.
    remediation: >
      Confirm the destination is intended. Notification code posts events; it
      does not need the environment.
    references:
      - https://attack.mitre.org/techniques/T1567/
    provenance:
      kind: research
      reference: reviews/2026-09-09-implementation-plan.md
      note: >
        Domain 9. The audit's case was a Discord webhook plus dict(os.environ)
        in application code -- two signals, where the generic exfil rule needs
        three, so it produced nothing at all.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - rule: INTEL.EGRESS.DROP_POINT.001
        - capability: credential
      unless:
        - path_glob: "**/*.test.*"
        - path_glob: "**/test_*.py"
        - path_glob: "tests/**"

  - id: MALWARE.EXFIL.DROP_POINT.001
    version: 1.0.0
    category: malicious
    severity: critical
    confidence: high
    title: Install-time code sends data to a drop point
    message: >
      An install or build script reads the environment and contacts a chat
      webhook, paste service or interaction host. Install-time code runs
      unprompted with the developer's full environment, and these destinations
      exist to receive data from somewhere that cannot host infrastructure.
      Together that is collection, not notification.
    remediation: >
      Treat the package as hostile. Rotate every credential reachable from a
      machine that installed it.
    references:
      - https://attack.mitre.org/techniques/T1567/
    provenance:
      kind: research
      reference: reviews/2026-09-09-implementation-plan.md
      note: Domain 9, install-time.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - context: install_hook
        - rule: INTEL.EGRESS.DROP_POINT.001
        - capability: credential

  - id: SUSPECT.EXFIL.CREDENTIAL_STORE.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: A credential store is read and the file reaches the network
    message: >
      This file reads a browser's saved-login database, an OS keychain, or a
      cloud or registry credential cache, and it also opens an outbound
      connection. Two signals rather than the usual three, because the source is
      itself the third: these stores are read by the software that owns them and
      by essentially nothing else, so the access has already explained itself.
    remediation: >
      Confirm this component owns the store it is reading. If it does not, treat
      every credential in that store as disclosed and rotate it.
    references:
      - https://attack.mitre.org/techniques/T1555/
    provenance:
      kind: research
      reference: reviews/2026-09-09-implementation-plan.md
      note: >
        Domains 6 and 8. The generic exfil rule needs three signals because
        reading configuration and calling an API is what an application does all
        day -- but reading Chrome's Login Data is not, and requiring a third
        signal there meant the clearest credential theft in the taxonomy
        produced nothing.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - rule: CAP.CREDENTIAL.STORE.001
        - capability: egress
      unless:
        - path_glob: "**/*.test.*"
        - path_glob: "**/test_*.py"
        - path_glob: "tests/**"

  - id: MALWARE.EXFIL.CREDENTIAL_STORE.001
    version: 1.0.0
    category: malicious
    severity: critical
    confidence: high
    title: Install-time code reads a credential store and reaches the network
    message: >
      An install or build script reads a browser login database, keychain or
      cloud credential cache and opens an outbound connection. No build needs
      any of those. This is a credential harvester running as the developer,
      before any review, test or container boundary applies.
    remediation: >
      Treat the package as hostile. Rotate every credential in every store
      reachable from a machine that installed it -- browser logins included.
    references:
      - https://attack.mitre.org/techniques/T1555/
    provenance:
      kind: research
      reference: reviews/2026-09-09-implementation-plan.md
      note: Domains 6 and 8, install-time.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      all:
        - context: install_hook
        - rule: CAP.CREDENTIAL.STORE.001
        - capability: egress
