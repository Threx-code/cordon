  - id: CAP.PY.AST.RECON.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: reconnaissance
    title: Identifies the machine, through whatever name it was given
    message: >
      This file reads the hostname, the user or the machine identity. Resolved
      from the parsed source, so `import socket as s; s.gethostname()` is seen
      the same as the plain call -- which the regex tier, keyed to the module
