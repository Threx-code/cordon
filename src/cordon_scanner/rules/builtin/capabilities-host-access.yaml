  - id: CAP.EXPOSE.ALL_INTERFACES.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: expose
    title: Listens on every network interface
    message: >
      This file starts a server on every network interface (0.0.0.0, "::" or a port with no host), so other machines
      on the network can reach it, not only this one.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '\.listen\(\s*\d{2,5}\s*,\s*["\x27](?:0\.0\.0\.0|::)["\x27]'
        - '\bhost\s*[:=]\s*["\x27](?:0\.0\.0\.0|::)["\x27]'
        - '\(\s*\(\s*["\x27](?:0\.0\.0\.0|::)?["\x27]\s*,\s*\d{2,5}\s*\)'
        - '\b(?:ListenAndServe(?:TLS)?|net\.Listen)\(\s*(?:"tcp[46]?"\s*,\s*)?"(?:0\.0\.0\.0)?:\d{2,5}"'
        - '\bbind\(\s*"(?:0\.0\.0\.0|\[::\]):\d{2,5}"'
        - '\bSocketAddr::from\(\(\s*\[\s*0\s*,\s*0\s*,\s*0\s*,\s*0\s*\]'
    tests:
      positive:
        - 'server.listen(8080, "0.0.0.0")'
        - 'http.ListenAndServe(":8080", nil)'
        - 'HTTPServer(("", 8000), Handler)'
      negative:
        - 'server.listen(8080, "127.0.0.1")'

  - id: CAP.EXPOSE.SERVES_HOME.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: expose
    title: Serves the home directory or the whole file system as files
    message: >
      This file starts a static file server rooted at the person's home directory or at the file-system root, so
      whoever can reach the server can download any file the person can read, keys and tokens included.
    remediation: No action for this signal alone.
    paths:
