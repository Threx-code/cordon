  - id: CAP.PERSIST.MCP_CONFIG_CURSOR.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: persist
    title: Writes Cursor's MCP server configuration
    message: >
      This file writes the file Cursor reads its MCP servers from, so the next time Cursor starts it
      launches whatever entry was written there.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '\b(?:writeFileSync|writeFile|appendFileSync|appendFile|createWriteStream|write_text|write_bytes|WriteFile|OpenFile|fs::write|File::create|OpenOptions)\b[^\n]{0,240}\.cursor[/\\]{1,2}mcp\.json'
        - '\.cursor[/\\]{1,2}mcp\.json[^\n]{0,240}(?:\bwrite_text\b|\bwrite_bytes\b|["\x27][wa]\+?["\x27]|\bO_WRONLY\b|\bO_CREATE\b)'
    tests:
      positive:
        - 'writeFileSync(join(homedir(), ".cursor/mcp.json"), entry)'
      negative:
        - 'const config = JSON.parse(readFileSync(join(homedir(), ".cursor/mcp.json"), "utf8"))'

