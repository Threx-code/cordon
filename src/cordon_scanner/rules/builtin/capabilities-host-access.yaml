        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '(?:clip\w*\s*\.\s*(?:write|writeText|copy|set_text)|pyperclip\s*\.\s*copy|\bpbcopy\b|\bxclip\b|Set-Clipboard)[^\n]{0,200}["\x27]0x[0-9a-fA-F]{40}["\x27]'
        - '\bpbcopy\b[^\n]{0,40}\n[^\n]{0,120}["\x27]0x[0-9a-fA-F]{40}["\x27]'
    tests:
      positive:
        - "await clip.write(\"0x00000000000000000000000000000000DeaDBeef\");"
      negative:
        - "await clip.write(text);"

  - id: CAP.RECON.KNOWN_HOSTS.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: reconnaissance
    title: Reads the list of hosts the person connects to over SSH
    message: This file reads the person's SSH known_hosts list.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '\.ssh[/\\]{1,2}known_hosts\b'
    tests:
      positive:
        - "for h in $(cut -d' ' -f1 ~/.ssh/known_hosts); do ssh $h uptime; done"
      negative:
        - "ssh -o StrictHostKeyChecking=accept-new host uptime"

  - id: CAP.RECON.KUBE_CONTEXTS.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: reconnaissance
    title: Lists every Kubernetes context and targets each
    message: This file lists the person's Kubernetes contexts and passes each to a command.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '\bget-contexts\b[^\n]{0,200}--context\b'
        - '--context\b[^\n]{0,200}\bget-contexts\b'
    tests:
      positive:
        - "for c in $(kubectl config get-contexts -o name); do kubectl --context $c apply -f m.yaml; done"
      negative:
