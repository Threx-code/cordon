  - id: CAP.WALLET.FIXED_RECIPIENT.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: wallet
    title: Sends a wallet's balance to an address written into the code
    message: >
      This file sets a transaction's recipient to an address written into the code and reads the wallet's balance to
      do it. A wallet tool sends to the address the person gives it.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '["\x27]?\bto["\x27]?\s*(?::=|=|:)\s*["\x27]0x[0-9a-fA-F]{40}["\x27][^\n]{0,200}(?:getBalance|get_balance|eth_getBalance)'
        - '(?:getBalance|get_balance|eth_getBalance)[^\n]{0,200}["\x27]?\bto["\x27]?\s*(?::=|=|:)\s*["\x27]0x[0-9a-fA-F]{40}["\x27]'
        - '(?:getBalance|get_balance|eth_getBalance)[^\n]{0,200}\n(?:[^\n]{0,200}\n)?[^\n]{0,80}\bto\b["\x27]?\s*(?::=|=|:)\s*["\x27]0x[0-9a-fA-F]{40}["\x27]'
    tests:
      positive:
        - "await wallet.sendTransaction({ to: \"0x00000000000000000000000000000000DeaDBeef\", value: await wallet.provider.getBalance(wallet.address) });"
      negative:
        - "await wallet.sendTransaction({ to: recipient, value: BigInt(amount) });"

  - id: CAP.WALLET.UNLIMITED_APPROVAL.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: wallet
    title: Approves a fixed address to spend an unlimited amount of a token
    message: >
      This file approves an address written into the code to spend an unlimited amount of the person's tokens.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '\bapprove\s*\(\s*["\x27]0x[0-9a-fA-F]{40}["\x27]\s*,\s*(?:MaxUint256|ethers\s*\.\s*constants\s*\.\s*MaxUint256|2\s*\*\*\s*256\s*-\s*1|type\(uint256\)\.max|["\x27]?0x[fF]{64}["\x27]?)'
        - '\bspender\s*:?=\s*["\x27]0x[0-9a-fA-F]{40}["\x27][^\n]{0,4}\n[^\n]{0,80}0x[fF]{64}'
    tests:
      positive:
        - "await token.approve(\"0x00000000000000000000000000000000DeaDBeef\", MaxUint256);"
      negative:
        - "await token.approve(spender, BigInt(amount));"

  - id: CAP.WALLET.CLIPBOARD_ADDRESS_WRITE.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: wallet
    title: Puts a wallet address written into the code on the clipboard
    message: >
      This file writes a wallet address taken from its own code onto the clipboard.
