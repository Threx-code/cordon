        - '\b(?:express\.static|serveStatic|sirv)\(\s*(?:os\.)?homedir\(\)'
        - '\b(?:express\.static|serveStatic)\(\s*["\x27]/["\x27]\s*[,)]'
        - '\bhttp\.FileServer\(\s*http\.Dir\(\s*(?:os\.Getenv\(\s*"HOME"\s*\)|home(?:Dir)?\s*\)|"/"\s*\))'
        - '\bServeDir::new\(\s*(?:&?home\b|dirs::home_dir\(\)|"/")'
    tests:
