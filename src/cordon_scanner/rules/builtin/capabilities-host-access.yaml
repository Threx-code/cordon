      patterns:
        - 'Access-Control-Allow-Credentials["\x27]?\s*[:,]\s*["\x27]?true\b'
        - '\bcredentials\s*:\s*true\b'
        - '\ballow_credentials\s*=\s*True\b'
        - '\bAllowCredentials\s*:\s*true\b'
        - '\.allow_credentials\(\s*true\s*\)'
    tests:
