  - id: SUSPECT.PERSIST.MCP_CLIENT_SPREAD.001
    version: 1.0.0
    category: suspicious
    severity: medium
    confidence: medium
    title: Writes an MCP server into several AI clients' configurations
    message: >
      This file writes MCP server entries into the configuration of two or more different AI clients (Cursor,
      Claude Desktop, Windsurf, VS Code and others), so each of them launches that server the next time it
      starts. A server that adds itself to every client it finds spreads the way an MCP worm does; an installer
      asked to configure one client writes one.
    remediation: >
      Remove the entries this wrote from every client's configuration, and find out what asked it to.
    match:
      kind: composite
      scope: file
      proximity: 40
      all:
        - any:
            - all:
                - rule: CAP.PERSIST.MCP_CONFIG_CURSOR.001
                - any:
                    - rule: CAP.PERSIST.MCP_CONFIG_CLAUDE_DESKTOP.001
                    - rule: CAP.PERSIST.MCP_CONFIG_WINDSURF.001
                    - rule: CAP.PERSIST.MCP_CONFIG_VSCODE.001
                    - rule: CAP.PERSIST.MCP_CONFIG_CLAUDE_CODE.001
                    - rule: CAP.PERSIST.MCP_CONFIG_GEMINI.001
                    - rule: CAP.PERSIST.MCP_CONFIG_CLINE.001
                    - rule: CAP.PERSIST.MCP_CONFIG_KIRO.001
            - all:
                - rule: CAP.PERSIST.MCP_CONFIG_CLAUDE_DESKTOP.001
                - any:
                    - rule: CAP.PERSIST.MCP_CONFIG_WINDSURF.001
                    - rule: CAP.PERSIST.MCP_CONFIG_VSCODE.001
                    - rule: CAP.PERSIST.MCP_CONFIG_CLAUDE_CODE.001
                    - rule: CAP.PERSIST.MCP_CONFIG_GEMINI.001
                    - rule: CAP.PERSIST.MCP_CONFIG_CLINE.001
                    - rule: CAP.PERSIST.MCP_CONFIG_KIRO.001
            - all:
                - rule: CAP.PERSIST.MCP_CONFIG_WINDSURF.001
                - any:
                    - rule: CAP.PERSIST.MCP_CONFIG_VSCODE.001
                    - rule: CAP.PERSIST.MCP_CONFIG_CLAUDE_CODE.001
                    - rule: CAP.PERSIST.MCP_CONFIG_GEMINI.001
                    - rule: CAP.PERSIST.MCP_CONFIG_CLINE.001
                    - rule: CAP.PERSIST.MCP_CONFIG_KIRO.001
            - all:
                - rule: CAP.PERSIST.MCP_CONFIG_VSCODE.001
                - any:
                    - rule: CAP.PERSIST.MCP_CONFIG_CLAUDE_CODE.001
