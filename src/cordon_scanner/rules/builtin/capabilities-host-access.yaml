  - id: SUSPECT.AUTH.TOKEN_PASSTHROUGH.001
    version: 1.0.0
    category: suspicious
    severity: medium
    confidence: medium
    title: Forwards the token a client sent to another service
    message: >
      This file reads the bearer token from a request it received and puts it in the Authorization header of a request
      it sends. The MCP specification forbids this token passthrough: the receiving host can then act as the person
      with the client's token.
    remediation: Obtain a token issued for the downstream service instead of forwarding the client's.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      proximity: 5
      all:
        - rule: CAP.EXPOSE.INBOUND_TOKEN.001
        - rule: CAP.EXPOSE.OUTBOUND_AUTH_HEADER.001
        - capability: egress

