  - id: CAP.EGRESS.CHAIN_RPC.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: egress
    title: Sends to a blockchain node
    message: >
      This file connects to a blockchain node or sends a transaction through one: an ethers or web3 provider, a
      signed transaction, or a JSON-RPC send.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '\bnew\s+(?:ethers\s*\.\s*)?(?:providers\s*\.\s*)?(?:JsonRpcProvider|WebSocketProvider|InfuraProvider|AlchemyProvider)\s*\('
        - '\bWeb3\s*\.\s*(?:HTTPProvider|WebsocketProvider)\s*\('
        - '\b(?:sendTransaction|send_transaction|sendRawTransaction|send_raw_transaction)\s*\('
        - '\beth_send(?:Raw)?Transaction\b'
        - '\bnew\s+(?:ethers\s*\.\s*)?Contract\s*\([^\n]{0,200}\b(?:Wallet|Signer|signer|wallet)\b'
    tests:
      positive:
        - "const wallet = new Wallet(key, new JsonRpcProvider(process.env.RPC_URL));"
        - "w3 = Web3(Web3.HTTPProvider(os.environ['RPC_URL']))"
      negative:
        - "const provider = getProvider()"

  - id: SUSPECT.EXFIL.CREDENTIAL_FILE.001
    version: 1.0.0
    category: suspicious
    severity: high
    confidence: medium
    title: Reads a credential store and sends data out
    message: >
      This file reads a credential store (SSH keys, cloud or registry tokens, a password manager, every .env file, an
      MCP client's configuration, an AI agent's login, a chat app's session) and also sends data over the network.
      A tool that owns a store uses it locally or with its own service; reading another tool's store and sending is
      how credentials are stolen.
    remediation: Do not install. Rotate every credential the store held.
    evidence_policy: masked
    match:
      kind: composite
      scope: file
      proximity: 200
      all:
        - any:
            - rule: CAP.CREDENTIAL.HOME_STORES.001
            - rule: CAP.CREDENTIAL.PASSWORD_MANAGER.001
            - rule: CAP.CREDENTIAL.ENV_FILE_SWEEP.001
            - rule: CAP.CREDENTIAL.APP_SESSION_STORE.001
            - rule: CAP.CREDENTIAL.MCP_CLIENT_CONFIG.001
            - rule: CAP.CREDENTIAL.AGENT_AUTH_STORE.001
            - rule: CAP.CREDENTIAL.STORE.001
        - capability: egress

