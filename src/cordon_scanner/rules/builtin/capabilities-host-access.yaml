        - '\bheaders\s*\[\s*["\x27][Aa]uthorization["\x27]\s*\](?!\s*=[^=])'
        - '\bheaders\.get\(\s*["\x27][Aa]uthorization["\x27]'
        - '\.Header\.Get\(\s*"Authorization"\s*\)'
        - '\bheaders(?:\(\))?\s*\.get\(\s*(?:(?:http::)?header::)?AUTHORIZATION\b'
