  - id: CAP.EXPOSE.CORS_ANY_ORIGIN.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: expose
    title: Accepts requests from any web origin
    message: >
      This file tells browsers that any website may call this server: an Access-Control-Allow-Origin of "*", the
      caller's own origin echoed back, or a CORS setting that allows every origin.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - 'Access-Control-Allow-Origin["\x27]?\s*[:,]\s*["\x27]\*["\x27]'
        - 'Access-Control-Allow-Origin["\x27]?\s*[:,]\s*(?:req|request|r)\.(?:headers?\.(?:origin\b|get\(\s*["\x27][Oo]rigin["\x27])|Header\.Get\(\s*"Origin")'
        - '\bcors\(\s*\{[^}]{0,160}\borigin\s*:\s*(?:true\b|["\x27]\*["\x27])'
        - '\ballow_origins\s*=\s*\[\s*["\x27]\*["\x27]\s*\]'
        - '\bAllowedOrigins\s*:\s*\[\]string\{\s*"\*"\s*\}'
        - '\bAllowAllOrigins\s*:\s*true\b'
        - '\.allow_origin\(\s*(?:Any\b|AllowOrigin::(?:any|mirror_request)\(\))'
    tests:
      positive:
        - 'res.setHeader("Access-Control-Allow-Origin", "*")'
        - 'app.add_middleware(CORSMiddleware, allow_origins=["*"])'
      negative:
        - 'res.setHeader("Access-Control-Allow-Origin", allowed)'

