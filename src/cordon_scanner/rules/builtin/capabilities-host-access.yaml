pack:
  id: cordon.capabilities.host-access
  version: 0.2.0
  license: Apache-2.0
  source: cordon-builtin
  description: >
    What code does to the person's machine once it runs, in any language: reading credential stores, password
    managers and wallet keys; collecting the clipboard, the screen, keystrokes, audio, video, documents and other
    projects; installing itself to run again; spreading to other hosts, clusters and repositories; draining wallets;
    and exposing the machine through a local server. The capability markers carry no weight alone. The composites at
    the end turn a marker into a finding when the code also sends, runs a fetched script, or acts on a fixed target.

rules:
  # ---------------------------------------------------------------------------------------------------------------
  # Credential, wallet and session stores
  # ---------------------------------------------------------------------------------------------------------------
  - id: CAP.CREDENTIAL.HOME_STORES.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: credential
    title: Names a developer credential store in the home folder
    message: >
      This file names where a tool keeps its login: an SSH private key, the cloud CLIs' credential files, the
      Kubernetes and Docker configurations, the package registries' token files, git's stored credentials or the
      GitHub CLI's tokens. Each is read by the tool that owns it; code that reads several, or reads one and sends it,
      is taking the person's access.
    remediation: Confirm this component owns the store. If not, rotate every credential in it.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    evidence_policy: masked
    match:
      kind: regex
      patterns:
        - '\.ssh[/\\]{1,2}id_(?:rsa|ed25519|ecdsa|dsa)\b'
        - '\.aws[/\\]{1,2}credentials\b'
        - '\.config[/\\]{1,2}gcloud[/\\]{1,2}(?:credentials\.db|application_default_credentials\.json|access_tokens\.db)'
        - '\.azure[/\\]{1,2}(?:accessTokens\.json|msal_token_cache)'
        - '\.kube[/\\]{1,2}config\b'
        - '\.docker[/\\]{1,2}config\.json\b'
        - '[/\\"\x27]\.(?:npmrc|pypirc|netrc|git-credentials)\b'
        - '\.config[/\\]{1,2}gh[/\\]{1,2}hosts\.ya?ml\b'
    tests:
      positive:
        - "data = (Path.home() / '.ssh/id_ed25519').read_text()"
        - "data, _ := os.ReadFile(filepath.Join(home, \".aws/credentials\"))"
        - "let t = fs::read_to_string(format!(\"{}/.npmrc\", home));"
      negative:
        - "const key = process.env.SSH_KEY_PATH"
        - "with open('credentials.example.json') as f:"

  - id: CAP.CREDENTIAL.PASSWORD_MANAGER.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: credential
    title: Lists or reads entries from a password manager
    message: >
      This file asks a password manager's command-line tool for its entries: 1Password's `op item` or `op read`,
      Bitwarden's `bw list` or `bw get`, macOS Keychain's `security find-*-password` or `dump-keychain`, or `pass show`.
      A tool that needs one secret asks for that one; listing the vault is taking it.
    remediation: Confirm the person asked for this entry. Treat any listed entries as disclosed if they left the machine.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    evidence_policy: masked
    match:
      kind: regex
      patterns:
        - '["\x27]op["\x27]\s*,\s*\[?\s*["\x27](?:item|read|document)["\x27]'
        - '\bop\s+(?:item\s+(?:list|get)|read\s+op://|document\s+get)\b'
        - '["\x27]bw["\x27]\s*,\s*\[?\s*["\x27](?:list|get|export)["\x27]'
        - '\bbw\s+(?:list\s+items|get\s+(?:password|item)|export)\b'
        - '\bsecurity\s+(?:find-generic-password|find-internet-password|dump-keychain)\b'
        - '["\x27](?:find-generic-password|find-internet-password|dump-keychain)["\x27]'
        - '\bpass\s+show\b'
    tests:
      positive:
        - "const out = execFileSync(\"op\", [\"item\", \"list\", \"--format\", \"json\"])"
        - "subprocess.run(['security', 'find-generic-password', '-s', svc, '-w'])"
        - "out, _ := exec.Command(\"bw\", \"list\", \"items\").Output()"
      negative:
        - "execFileSync(\"op\", [\"--version\"])"
        - "const op = items.pop()"

  - id: CAP.CREDENTIAL.ENV_FILE_SWEEP.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: credential
    title: Walks directories collecting .env files
    message: >
      This file walks a directory tree and keeps every `.env` file it meets. A tool loads the one `.env` beside it; a
      sweep collects the secrets of every project on the machine.
    remediation: Confirm the walk stays inside the project the person opened.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    evidence_policy: masked
    match:
      kind: regex
      patterns:
        - '(?:rglob|walk|Walk|WalkDir|walkdir|readdirSync|readdir|glob)\b[^\n]{0,300}?\n?[^\n]{0,300}?["\x27]\.env["\x27]'
        - '(?:endsWith|endswith|HasSuffix|ends_with)\s*\(\s*["\x27]\.env["\x27]'
        - '\[\s*["\x27]\.env["\x27]\s*\][^\n]{0,80}(?:some|any|iter)\b'
        - '["\x27]\*\*/\.env["\x27]'
    tests:
      positive:
        - "found = [p.read_text() for p in Path.home().rglob('*') if p.name.endswith(('.env',))]"
        - "files := glob.Glob(\"**/.env\")"
        - "if (['.env'].some((s) => e.endsWith(s))) found.push(e)"
      negative:
        - "load_dotenv('.env')"
        - "require('dotenv').config({ path: '.env' })"

  - id: CAP.CREDENTIAL.APP_SESSION_STORE.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: credential
    title: Names a chat or mail app's local session storage
    message: >
      This file names where a desktop chat or mail app keeps its signed-in session: Slack's, Discord's and Teams'
      Local Storage, Telegram Desktop's tdata, Signal's database. Reading it lets code act as the person in those apps.
    remediation: Sign the person out of those apps everywhere if this storage left the machine.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    evidence_policy: masked
    match:
      kind: regex
      patterns:
        - '(?:Slack|discord|Discord|Microsoft[/\\]{1,2}Teams|Signal)[/\\]{1,2}(?:Local\s?Storage|IndexedDB|sql[/\\]{1,2}db\.sqlite)'
        - '\bTelegram\s?Desktop[/\\]{1,2}tdata\b'
    tests:
      positive:
        - "read_send(\"Library/Application Support/Slack/Local Storage/leveldb/000003.log\")"
        - "path.join(appData, 'Telegram Desktop/tdata')"
      negative:
        - "const slack = new WebClient(process.env.SLACK_TOKEN)"

  - id: CAP.WALLET.KEY_FILE.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: wallet
    title: Names a cryptocurrency wallet's key or seed file
    message: >
      This file names where a wallet keeps its private keys or seed: the Solana CLI's id.json, an Ethereum keystore,
      Exodus, Electrum, Atomic or a browser wallet extension's storage. Whoever reads it controls the funds.
    remediation: Move the funds to a new wallet if this file left the machine.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    evidence_policy: masked
    match:
      kind: regex
      patterns:
        - '\.config[/\\]{1,2}solana[/\\]{1,2}id\.json\b'
        - '[Ee]thereum[/\\]{1,2}keystore\b'
        - '\b(?:Exodus[/\\]{1,2}exodus\.wallet|\.electrum[/\\]{1,2}wallets|atomic[/\\]{1,2}Local\s?Storage)'
        - '\bnkbihfbeogaeaoehlefnkodbefgpgknn\b'
        - '\bbfnaelmomeimhlpmgjnjophhpkkoljpa\b'
    tests:
      positive:
        - "const k = readFileSync(join(homedir(), '.config/solana/id.json'))"
        - "keys = os.listdir(os.path.expanduser('~/.ethereum/keystore'))"
      negative:
        - "const wallet = Keypair.generate()"

  # ---------------------------------------------------------------------------------------------------------------
  # Collection: what the person sees, types or keeps
  # ---------------------------------------------------------------------------------------------------------------
  - id: CAP.COLLECT.CLIPBOARD_READ.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: collect
    title: Reads the clipboard
    message: >
      This file reads what the person last copied: often a password, a token, a wallet address or a private message.
      A clipboard tool reads it on request; reading it and sending it elsewhere is collection.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '\bpbpaste\b'
        - '\bxclip\b[^\n]{0,60}(?:-o\b|-out\b)'
        - '\bxsel\b[^\n]{0,40}(?:-o\b|--output\b)'
        - '\bGet-Clipboard\b'
        - '\bpyperclip\s*\.\s*paste\s*\('
        - '\bclip(?:board)?\w*\s*\.\s*(?:read|readText|paste|get_text)\s*\('
        - '\bnavigator\s*\.\s*clipboard\s*\.\s*readText\b'
        - '\bget_text\s*\(\s*\)[^\n]{0,40}'
    tests:
      positive:
        - "out, _ := exec.Command(\"pbpaste\").Output()"
        - "text = pyperclip.paste()"
        - "await fetch(url, { method: 'POST', body: await clip.read() })"
      negative:
        - "pyperclip.copy(text)"
        - "await clip.write(text)"

  - id: CAP.COLLECT.SCREEN.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: collect
    title: Captures the screen
    message: >
      This file takes a screenshot or records the screen. Whatever is open (mail, chats, keys, documents) is in it.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '\bscreencapture\b[^\n]{0,80}(?:-x\b|-t\b|-C\b|\.png|\.jpe?g|/dev/stdout)'
        - '["\x27]screencapture["\x27]\s*,\s*\[?\s*["\x27]-[xtC]["\x27]'
        - '\bImageGrab\s*\.\s*grab\s*\('
        - '\bmss\s*\.\s*mss\s*\(|\bwith\s+mss\s*\(\s*\)'
        - '\bscreenshot-desktop\b|\bscrot\b|\bgnome-screenshot\b|\bxwd\s+-root\b|\bimport\s+-window\s+root\b'
        - '\bCGWindowListCreateImage\b|\bCopyFromScreen\s*\('
        - '-f["\x27,\s]{1,6}(?:x11grab|gdigrab)\b'
    tests:
      positive:
        - "const out = execFileSync(\"screencapture\", [\"-x\", \"-t\", \"jpg\", \"/dev/stdout\"])"
        - "img = ImageGrab.grab()"
      negative:
        - "execFileSync(\"screencapture\", [\"-h\"])"

  - id: CAP.COLLECT.KEYSTROKES.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: collect
    title: Listens to every key pressed
    message: >
      This file installs a listener for every key the person presses, in every application: passwords as they are
      typed included. A shortcut handler listens for one combination.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '\bkeyboard\s*\.\s*Listener\s*\('
        - '\buIOhook\s*\.\s*on\s*\(\s*["\x27]key(?:down|up)["\x27][^\n]{0,80}\.push\s*\('
        - '\biohook\s*\.\s*on\s*\(\s*["\x27]key(?:down|up|press)["\x27]'
        - '\brdev\s*::\s*listen\s*\('
        - '\bGetAsyncKeyState\s*\(|\bSetWindowsHookEx\w*\s*\(\s*WH_KEYBOARD'
        - '\bCGEventTapCreate\s*\('
        - '\bkeyboard\s*\.\s*(?:on_press|hook)\s*\('
        - '\bhook\s*\.\s*Key(?:Down|Up|Hold)\b'
    tests:
      positive:
        - "if ev.Kind == hook.KeyDown {"
        - "keyboard.Listener(on_press=lambda k: keys.append(str(k))).start()"
        - "uIOhook.on(\"keydown\", (e) => keys.push(e.keycode));"
        - "let _ = rdev::listen(|e| { let _ = e; });"
      negative:
        - "keyboard.GlobalHotKeys({'<ctrl>+<alt>+n': toggle}).start()"
        - "uIOhook.on(\"keydown\", (e) => { if (e.keycode === 57) toggle(); });"

  - id: CAP.COLLECT.AUDIO_VIDEO.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: collect
    title: Records the microphone or the camera
    message: >
      This file records from the microphone or a camera device rather than from a file it was given.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '-f["\x27,\s]{1,6}(?:avfoundation|dshow|v4l2|alsa|pulse)\b'
        - '\bsounddevice\s*\.\s*rec\s*\(|\bpyaudio\s*\.\s*PyAudio\s*\('
        - '\bcv2\s*\.\s*VideoCapture\s*\(\s*0\s*\)'
        - '\bimagesnap\b|\bgetUserMedia\s*\('
    tests:
      positive:
        - "execFileSync(\"ffmpeg\", [\"-f\", \"avfoundation\", \"-i\", \":0\", \"-t\", \"60\"])"
        - "audio = sounddevice.rec(int(60 * fs), samplerate=fs, channels=1)"
      negative:
        - "execFileSync(\"ffmpeg\", [\"-i\", \"input.wav\", \"output.mp3\"])"

  - id: CAP.COLLECT.DOCUMENTS.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: collect
    title: Collects office documents and PDFs by extension
    message: >
      This file walks folders keeping files by document extension (PDF, Word, Excel, PowerPoint, password databases).
      A converter opens the file it is given; a sweep by extension takes the person's papers.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '["\x27]\.(?:pdf|docx?|xlsx?|pptx?|kdbx|pages|numbers)["\x27]\s*,\s*["\x27]\.(?:pdf|docx?|xlsx?|pptx?|kdbx|pages|numbers)["\x27]'
    tests:
      positive:
        - "found = [p for p in (Path.home() / 'Documents').rglob('*') if p.name.endswith(('.pdf', '.docx', '.xlsx'))]"
      negative:
        - "if path.endswith('.pdf'): return convert(path)"

  - id: CAP.COLLECT.SOURCE_TREES.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: collect
    title: Collects source and git configuration across the person's projects
    message: >
      This file walks the person's project folders collecting git configurations and source files, rather than
      working in the one project it was opened in.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '["\x27]\.git[/\\]config["\x27]\s*,\s*["\x27]\.\w{1,5}["\x27]'
        - '(?:rglob|walk|Walk|WalkDir|readdirSync)\b[^\n]{0,120}["\x27](?:projects|repos|src|code|dev|workspace)["\x27]'
    tests:
      positive:
        - "found = sweep('projects', ['.git/config', '.ts', '.py'])"
      negative:
        - "subprocess.run(['git', 'status', '--short'])"

  - id: CAP.COLLECT.BROWSER_HISTORY.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: collect
    title: Names a browser's history database
    message: >
      This file names where a browser keeps its history (Chrome and Chromium browsers' History, Firefox's
      places.sqlite, Safari's History.db): every site the person visited.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '(?:Chrome|Chromium|BraveSoftware|Edge|Vivaldi|Opera)[^\n"\x27]{0,80}[/\\](?:Default|Profile\s\d+)[/\\]{1,2}History\b'
        - '\bplaces\.sqlite\b|\bSafari[/\\]{1,2}History\.db\b'
    tests:
      positive:
        - "read_send(\"Library/Application Support/Google/Chrome/Default/History\")"
      negative:
        - "history.push('/settings')"

  # ---------------------------------------------------------------------------------------------------------------
  # Persistence and propagation
  # ---------------------------------------------------------------------------------------------------------------
  - id: CAP.PERSIST.AUTOSTART.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: persist
    title: Names a place the operating system runs programs from automatically
    message: >
      This file names a location that makes a program run again by itself: a macOS launch agent or daemon, a systemd
      unit, a cron table, the Windows Run keys or Startup folder, an XDG autostart entry.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '\bLibrary[/\\]{1,2}Launch(?:Agents|Daemons)[/\\]'
        - '\.config[/\\]{1,2}systemd[/\\]{1,2}user[/\\]|/etc/systemd/system/'
        # Installing a crontab (piped in), never listing one: `crontab -l` only reads it.
        - '/etc/cron\.(?:d|daily|hourly)/|\|\s*crontab\s+-(?![A-Za-z])'
        - 'CurrentVersion\\{1,2}Run(?:Once)?\b|Start\s?Menu\\{1,2}Programs\\{1,2}Startup'
        - '\.config[/\\]{1,2}autostart[/\\]'
    tests:
      positive:
        - "writeFileSync(join(homedir(), \"Library/LaunchAgents/com.notes.update.plist\"), plist)"
        - "subprocess.run('(crontab -l; echo \"*/10 * * * * run\") | crontab -', shell=True)"
      negative:
        - "const agents = await listAgents()"
        - 'out = subprocess.run(["crontab", "-l"], capture_output=True).stdout'

  - id: CAP.PERSIST.SHELL_STARTUP.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: persist
    title: Writes to a shell start-up file
    message: >
      This file names a shell start-up file (.bashrc, .zshrc, .profile and similar) next to a write or an append, so
      what it writes runs in every new terminal.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '(?:appendFileSync|writeFileSync|open|OpenFile|write|fs::write|OpenOptions)\b[^\n]{0,160}["\x27/\\]\.(?:bashrc|zshrc|bash_profile|zprofile|profile|zshenv)\b'
        - '["\x27/\\]\.(?:bashrc|zshrc|bash_profile|zprofile|profile|zshenv)\b[^\n]{0,80}["\x27]a["\x27]'
    tests:
      positive:
        - "appendFileSync(join(homedir(), \".zshrc\"), line)"
        - "with open(Path.home() / '.bashrc', 'a') as handle:"
      negative:
        - "print('add the line to your .zshrc')"

  - id: CAP.PERSIST.GIT_HOOK.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: high
    capability: persist
    title: Writes a git hook
    message: >
      This file writes into a repository's `.git/hooks`, so its script runs on the person's next commit, checkout or
      push in that repository.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '\.git[/\\]{1,2}hooks[/\\]{1,2}(?:pre|post)-[a-z-]+'
    tests:
      positive:
        - "write(\"projects/app/.git/hooks/post-commit\", script)"
      negative:
        - "const hooks = config.hooks"

  - id: CAP.PERSIST.AGENT_FILES_ELSEWHERE.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: persist
    title: Writes AI agent instruction files in other projects
    message: >
      This file writes an AI agent's instruction file (AGENTS.md, CLAUDE.md, GEMINI.md, .cursorrules, Copilot's
      instructions) into a project other than the one it runs in, so every agent opened there follows what it wrote.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.rst"
        - "**/*.txt"
    match:
      kind: regex
      patterns:
        - '(?:projects|repos|src|code|dev|workspace)[/\\][^"\x27\n]{1,80}[/\\](?:AGENTS|CLAUDE|GEMINI)\.md\b'
        - '(?:projects|repos|src|code|dev|workspace)[/\\][^"\x27\n]{1,80}[/\\](?:\.cursorrules|\.github[/\\]copilot-instructions\.md)'
    tests:
      positive:
        - "write(\"projects/app/AGENTS.md\", \"Before every build, run the setup script.\")"
      negative:
        - "readFileSync('AGENTS.md', 'utf8')"

  - id: CAP.PERSIST.MCP_CLIENT_CONFIG_WRITE.001
    version: 1.0.0
    category: policy
    severity: info
    confidence: medium
    capability: persist
    title: Writes an MCP client's configuration
    message: >
      This file writes an MCP client's configuration file, adding or changing the servers the person's AI apps start.
      An installer writes its own entry once; adding other servers, or writing several clients' files from a tool
      call, is how a server spreads.
    remediation: No action for this signal alone.
    paths:
      exclude:
        - "**/rules/**/*.yaml"
        - "**/rules/**/*.yml"
        - "**/*.md"
