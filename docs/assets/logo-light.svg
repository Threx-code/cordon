<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 64" width="196" height="64"
     role="img" aria-labelledby="title desc">
  <title id="title">Cordon</title>
  <desc id="desc">The Cordon wordmark: a cordon line drawn as a C, with a check standing in its gap.</desc>

  <!-- The light variant. Two files rather than one with a media query,
       because a README renders through an image proxy that does not run CSS,
       and a logo that only works in one theme is wrong half the time. -->

  <g transform="translate(4 4) scale(0.875)">
  <!-- Two colours, and the split is the idea rather than decoration. The curve
       is the cordon. The square is the check standing in its gap: round line,
       square post, because the boundary is drawn and the thing enforcing it is
       built. -->
  <path d="M 43.47 15.62 A 20 20 0 1 0 43.47 48.38"
        fill="none" stroke="#1f7a6f" stroke-width="8" stroke-linecap="round"/>
  <rect x="43.5" y="26.5" width="11" height="11" rx="2.5" fill="#d9822b"/>
  </g>

  <!-- Monospace, because every other surface this project has is a terminal.
       The baseline sits on the mark's own centre line so the two read as one
       object rather than as a mark with a label beside it. -->
  <text x="72" y="42" fill="#10241f"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="29" font-weight="600" letter-spacing="0.5">cordon</text>
</svg>
