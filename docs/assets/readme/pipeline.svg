<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">How a scan works</title>
<desc id="d">Five stages. Target: a repository, an archive, a package, an image or git history. Identify: 28 ecosystems, languages, lockfiles. Detect: 1,475 rules, code reading, binaries, the agent chain. Decide: score, policy, baseline, VEX. Report: text, JSON, SARIF, JUnit, GitHub, SBOM. Underneath, three guarantees: it reads and never executes; nothing about the code leaves the machine unless asked; the same input gives the same findings.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.node{opacity:0;animation:in .5s ease-out forwards}
.n1{animation-delay:.1s}.n2{animation-delay:.25s}.n3{animation-delay:.4s}.n4{animation-delay:.55s}.n5{animation-delay:.7s}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
.packet{animation:travel 5s cubic-bezier(.45,0,.55,1) infinite}
.hot{opacity:0;animation:hot 5s ease-in-out infinite}
.h1{animation-delay:0s}.h2{animation-delay:1s}.h3{animation-delay:2s}.h4{animation-delay:3s}.h5{animation-delay:4s}
.pill{opacity:0;animation:in .5s ease-out 1s forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes travel{0%{transform:translateX(0);opacity:0}4%{opacity:1}92%{opacity:1}100%{transform:translateX(920px);opacity:0}}
@keyframes hot{0%,100%{opacity:0}8%,16%{opacity:1}26%{opacity:0}}
@media (prefers-reduced-motion:reduce){.node,.pill{animation:none;opacity:1;transform:none}.flow,.packet,.hot{animation:none}.packet{opacity:0}}
</style>
<defs><radialGradient id="pk"><stop offset="0" stop-color="#f0a94c"/><stop offset=".45" stop-color="#f0a94c" stop-opacity=".5"/><stop offset="1" stop-color="#f0a94c" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="400" rx="18" fill="#0b1110"/>
<rect x=".5" y=".5" width="1199" height="399" rx="17.5" fill="none" stroke="#22302c"/>
<text x="48" y="64" fill="#f2f7f5" font-size="26" font-weight="700">How a scan works</text>
<text x="48" y="92" fill="#8fa49d" font-size="14">One pass from target to report. Every stage reads; none runs the code it reads.</text>

<line class="flow" x1="140" y1="196" x2="1060" y2="196" stroke="#2c3d38" stroke-width="2"/>
<circle class="packet" cx="140" cy="196" r="14" fill="url(#pk)"/>

<g font-size="13">
<g class="node n1"><rect x="48" y="124" width="196" height="144" rx="14" fill="#121a18" stroke="#22302c"/><rect class="hot h1" x="48" y="124" width="196" height="144" rx="14" fill="none" stroke="#f0a94c" stroke-width="1.5"/>
<text x="68" y="152" fill="#4f625c" font-size="12">01</text><text x="68" y="178" fill="#f2f7f5" font-size="17" font-weight="700">Target</text>
<text x="68" y="212" fill="#8fa49d" font-size="12">repository · archive</text><text x="68" y="230" fill="#8fa49d" font-size="12">package · image</text><text x="68" y="248" fill="#8fa49d" font-size="12">git history</text></g>
<g class="node n2"><rect x="266" y="124" width="196" height="144" rx="14" fill="#121a18" stroke="#22302c"/><rect class="hot h2" x="266" y="124" width="196" height="144" rx="14" fill="none" stroke="#f0a94c" stroke-width="1.5"/>
<text x="286" y="152" fill="#4f625c" font-size="12">02</text><text x="286" y="178" fill="#f2f7f5" font-size="17" font-weight="700">Identify</text>
<text x="286" y="212" fill="#8fa49d" font-size="12">28 ecosystems</text><text x="286" y="230" fill="#8fa49d" font-size="12">languages</text><text x="286" y="248" fill="#8fa49d" font-size="12">manifests · lockfiles</text></g>
<g class="node n3"><rect x="484" y="124" width="232" height="144" rx="14" fill="#121a18" stroke="#35c3b1" stroke-opacity=".5"/><rect class="hot h3" x="484" y="124" width="232" height="144" rx="14" fill="none" stroke="#f0a94c" stroke-width="1.5"/>
<text x="504" y="152" fill="#4f625c" font-size="12">03</text><text x="504" y="178" fill="#56d4c4" font-size="17" font-weight="700">Detect</text>
<text x="504" y="212" fill="#8fa49d" font-size="12">1,475 rules</text><text x="504" y="230" fill="#8fa49d" font-size="12">code reading · binaries</text><text x="504" y="248" fill="#8fa49d" font-size="12">the agent chain</text></g>
<g class="node n4"><rect x="738" y="124" width="196" height="144" rx="14" fill="#121a18" stroke="#22302c"/><rect class="hot h4" x="738" y="124" width="196" height="144" rx="14" fill="none" stroke="#f0a94c" stroke-width="1.5"/>
<text x="758" y="152" fill="#4f625c" font-size="12">04</text><text x="758" y="178" fill="#f2f7f5" font-size="17" font-weight="700">Decide</text>
<text x="758" y="212" fill="#8fa49d" font-size="12">score · policy</text><text x="758" y="230" fill="#8fa49d" font-size="12">baseline · VEX</text><text x="758" y="248" fill="#8fa49d" font-size="12">what fails the build</text></g>
<g class="node n5"><rect x="956" y="124" width="196" height="144" rx="14" fill="#121a18" stroke="#22302c"/><rect class="hot h5" x="956" y="124" width="196" height="144" rx="14" fill="none" stroke="#f0a94c" stroke-width="1.5"/>
<text x="976" y="152" fill="#4f625c" font-size="12">05</text><text x="976" y="178" fill="#f2f7f5" font-size="17" font-weight="700">Report</text>
<text x="976" y="212" fill="#8fa49d" font-size="12">text · JSON · SARIF</text><text x="976" y="230" fill="#8fa49d" font-size="12">JUnit · GitHub</text><text x="976" y="248" fill="#8fa49d" font-size="12">SBOM · AI-BOM</text></g>
</g>

<g class="pill" font-size="13">
<rect x="48" y="304" width="356" height="56" rx="12" fill="#0f1715" stroke="#22302c"/><circle cx="74" cy="332" r="6" fill="#8bd49c"/><text x="92" y="328" fill="#f2f7f5" font-weight="700">Reads, never executes</text><text x="92" y="347" fill="#6d827b" font-size="12">safe on hostile packages</text>
<rect x="422" y="304" width="356" height="56" rx="12" fill="#0f1715" stroke="#22302c"/><circle cx="448" cy="332" r="6" fill="#8bd49c"/><text x="466" y="328" fill="#f2f7f5" font-weight="700">Your code stays yours</text><text x="466" y="347" fill="#6d827b" font-size="12">nothing about it sent unless asked</text>
<rect x="796" y="304" width="356" height="56" rx="12" fill="#0f1715" stroke="#22302c"/><circle cx="822" cy="332" r="6" fill="#8bd49c"/><text x="840" y="328" fill="#f2f7f5" font-weight="700">Deterministic</text><text x="840" y="347" fill="#6d827b" font-size="12">same input, same findings</text>
</g>
</svg>
