<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">Cordon: every dependency, read before it runs</title>
<desc id="d">The Cordon mark draws in beside the tagline. On the right, the findings of a real scan of a repository appear as a scan line passes over it: a workflow exfiltrating secrets, an AWS key, a poisoned MCP server, hidden bidirectional text and an npm token, nine findings that fail the build.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.arc{stroke-dasharray:118;stroke-dashoffset:118;animation:draw 1.3s cubic-bezier(.6,0,.2,1) .2s forwards}
.post{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) 1.3s forwards,beat 4s ease-in-out 3s infinite}
.rise{opacity:0;animation:rise .7s ease-out forwards}
.r1{animation-delay:.5s}.r2{animation-delay:.8s}.r3{animation-delay:1.1s}.r4{animation-delay:1.4s}
.row{opacity:0;animation:row 10s linear infinite}
.f1{animation-delay:.6s}.f2{animation-delay:1.3s}.f3{animation-delay:2s}.f4{animation-delay:2.7s}.f5{animation-delay:3.4s}.f6{animation-delay:4.1s}
.beam{animation:beam 10s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.8}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes row{0%{opacity:0}3%{opacity:1}88%{opacity:1}94%,100%{opacity:0}}
@keyframes beam{0%{transform:translateY(0);opacity:0}4%{opacity:1}45%{transform:translateY(250px);opacity:1}50%,100%{transform:translateY(250px);opacity:0}}
@media (prefers-reduced-motion:reduce){.arc,.post,.rise,.row,.beam{animation:none;opacity:1;stroke-dashoffset:0;transform:none}.beam{opacity:0}}
</style>
<defs>
<radialGradient id="glow" cx="22%" cy="35%" r="60%"><stop offset="0" stop-color="#35c3b1" stop-opacity=".22"/><stop offset="1" stop-color="#35c3b1" stop-opacity="0"/></radialGradient>
<radialGradient id="ember" cx="88%" cy="90%" r="45%"><stop offset="0" stop-color="#f0a94c" stop-opacity=".10"/><stop offset="1" stop-color="#f0a94c" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#22302c"/></pattern>
<linearGradient id="beamg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#56d4c4" stop-opacity="0"/><stop offset=".9" stop-color="#56d4c4" stop-opacity=".22"/><stop offset="1" stop-color="#56d4c4" stop-opacity=".9"/></linearGradient>
<clipPath id="panel"><rect x="676" y="56" width="484" height="328" rx="12"/></clipPath>
</defs>
<rect width="1200" height="440" rx="18" fill="#0b1110"/>
<rect width="1200" height="440" rx="18" fill="url(#dots)"/>
<rect width="1200" height="440" rx="18" fill="url(#glow)"/>
<rect width="1200" height="440" rx="18" fill="url(#ember)"/>
<rect x=".5" y=".5" width="1199" height="439" rx="17.5" fill="none" stroke="#22302c"/>

<g transform="translate(58 92) scale(1.9)">
<path class="arc" d="M 43.47 15.62 A 20 20 0 1 0 43.47 48.38" fill="none" stroke="#35c3b1" stroke-width="8" stroke-linecap="round"/>
<rect class="post" x="43.5" y="26.5" width="11" height="11" rx="2.5" fill="#f0a94c"/>
</g>
<text class="rise r1" x="190" y="178" fill="#e8f2f0" font-size="66" font-weight="600" letter-spacing="1">cordon</text>
<text class="rise r2" x="62" y="262" fill="#f2f7f5" font-size="25" font-weight="700">Every dependency, read before it runs.</text>
<g class="rise r3" fill="#8fa49d" font-size="16">
<text x="62" y="300">Supply-chain security for source, packages, container</text>
<text x="62" y="324">images, CI pipelines and AI agents. It reads; it never</text>
<text x="62" y="348">executes what it scans.</text>
</g>
<g class="rise r4" font-size="13" fill="#d6e2de">
<rect x="62" y="372" width="190" height="30" rx="15" fill="#121a18" stroke="#2c3d38"/><text x="157" y="392" text-anchor="middle"><tspan fill="#8bd49c" font-weight="700">0</tspan> runtime dependencies</text>
<rect x="260" y="372" width="134" height="30" rx="15" fill="#121a18" stroke="#2c3d38"/><text x="327" y="392" text-anchor="middle"><tspan fill="#56d4c4" font-weight="700">28</tspan> ecosystems</text>
<rect x="402" y="372" width="122" height="30" rx="15" fill="#121a18" stroke="#2c3d38"/><text x="463" y="392" text-anchor="middle"><tspan fill="#56d4c4" font-weight="700">1,475</tspan> rules</text>
<rect x="532" y="372" width="128" height="30" rx="15" fill="#121a18" stroke="#2c3d38"/><text x="596" y="392" text-anchor="middle">air-gap ready</text>
</g>

<g>
<rect x="676" y="56" width="484" height="328" rx="12" fill="#0f1715" stroke="#2c3d38"/>
<rect x="676" y="56" width="484" height="34" rx="12" fill="#121a18"/><rect x="676" y="78" width="484" height="12" fill="#121a18"/>
<line x1="676" y1="90" x2="1160" y2="90" stroke="#22302c"/>
<circle cx="696" cy="73" r="5" fill="#ff5f57"/><circle cx="713" cy="73" r="5" fill="#febc2e"/><circle cx="730" cy="73" r="5" fill="#28c840"/>
<text x="918" y="77" text-anchor="middle" fill="#6d827b" font-size="12">acme-platform</text>
<text x="694" y="116" font-size="13"><tspan fill="#35c3b1" font-weight="700">❯ </tspan><tspan fill="#d6e2de">cordon-scanner scan .</tspan></text>
<g clip-path="url(#panel)" font-size="12">
<g class="row f1"><text x="694" y="146" fill="#56d4c4" font-weight="700">.github/workflows/release.yml</text>
<rect x="694" y="152" width="66" height="17" rx="3" fill="#d42b3c"/><text x="727" y="164.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">CRITICAL</text><text x="768" y="165" fill="#6d827b">MALWARE.CI.SECRET_EXFIL.001</text></g>
<g class="row f2"><text x="694" y="192" fill="#56d4c4" font-weight="700">services/api/settings.py</text>
<rect x="694" y="198" width="66" height="17" rx="3" fill="#d42b3c"/><text x="727" y="210.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">CRITICAL</text><text x="768" y="211" fill="#6d827b">SECRET.AWS.ACCESS_KEY.001</text></g>
<g class="row f3"><text x="694" y="238" fill="#56d4c4" font-weight="700">.mcp.json</text>
<rect x="694" y="244" width="66" height="17" rx="3" fill="#ff8a8a"/><text x="727" y="256.5" text-anchor="middle" fill="#0b1110" font-weight="700" font-size="11">HIGH</text><text x="768" y="257" fill="#6d827b">SUSPECT.MCP.TOOL_DESCRIPTION.001</text></g>
<g class="row f4"><text x="694" y="284" fill="#56d4c4" font-weight="700">src/access.js</text>
<rect x="694" y="290" width="66" height="17" rx="3" fill="#ff8a8a"/><text x="727" y="302.5" text-anchor="middle" fill="#0b1110" font-weight="700" font-size="11">HIGH</text><text x="768" y="303" fill="#6d827b">SUSPECT.OBFUSCATION.BIDI.001</text></g>
<g class="row f5"><text x="694" y="330" fill="#56d4c4" font-weight="700">services/api/deploy.js</text>
<rect x="694" y="336" width="66" height="17" rx="3" fill="#d42b3c"/><text x="727" y="348.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">CRITICAL</text><text x="768" y="349" fill="#6d827b">SECRET.NPM.TOKEN.001</text></g>
<g class="row f6"><text x="694" y="374" fill="#ff6b7a" font-weight="700">FAILED: <tspan fill="#d6e2de" font-weight="400">9 findings met the failure policy</tspan></text></g>
<rect class="beam" x="676" y="100" width="484" height="36" fill="url(#beamg)"/>
</g>
</g>
</svg>
