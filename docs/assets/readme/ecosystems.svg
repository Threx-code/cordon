<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">Twenty-eight ecosystems</title>
<desc id="d">Package managers: npm, PyPI, Cargo, Go modules, Maven, Gradle, NuGet, RubyGems, Composer, Hex, Pub, CocoaPods, Swift, Conan, vcpkg, Conda, CRAN, Hackage, Julia, opam, Nix, Homebrew, Bazel. Infrastructure: GitHub Actions, Terraform, Helm, Ansible, container images.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.chip{opacity:0;animation:in .45s ease-out forwards}
.sweep{animation:sweep 6s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes sweep{0%{transform:translateX(-260px)}60%,100%{transform:translateX(1300px)}}
@media (prefers-reduced-motion:reduce){.chip{animation:none;opacity:1;transform:none}.sweep{animation:none;opacity:0}}
</style>
<defs>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#56d4c4" stop-opacity="0"/><stop offset=".5" stop-color="#56d4c4" stop-opacity=".10"/><stop offset="1" stop-color="#56d4c4" stop-opacity="0"/></linearGradient>
<clipPath id="card"><rect width="1200" height="330" rx="18"/></clipPath>
</defs>
<rect width="1200" height="330" rx="18" fill="#0b1110"/>
<rect x=".5" y=".5" width="1199" height="329" rx="17.5" fill="none" stroke="#22302c"/>
<text x="48" y="64" fill="#f2f7f5" font-size="26" font-weight="700">Twenty-eight ecosystems</text>
<text x="48" y="92" fill="#8fa49d" font-size="14">Manifests, lockfiles and what they resolve to, each with the checks its format allows.</text>
<text x="48" y="130" fill="#6d827b" font-size="12" letter-spacing="1">PACKAGE MANAGERS</text>
<text x="48" y="250" fill="#6d827b" font-size="12" letter-spacing="1">INFRASTRUCTURE</text>
