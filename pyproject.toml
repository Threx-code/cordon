[build-system]
# Floor only. The release installs an exact, hash-pinned toolchain from
# requirements-build.txt and builds with --no-isolation, so this range is
# what an ordinary `pip install .` uses rather than what ships a release.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cordon-scanner"
dynamic = ["version"]
description = "Language-agnostic software supply-chain security scanner. Detects malicious packages, suspicious install-time behaviour, secrets and dependency risk across any ecosystem."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Oluwatosin Amokeodo", email = "oluwatosin.amokeodo@gmail.com" },
]
keywords = [
    "security",
    "supply-chain",
    "malware",
    "sast",
    "sarif",
    "dependency-scanning",
    "sbom",
    "static-analysis",
    "devsecops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.11"

# CONSTRAINT C1: the core has ZERO third-party runtime dependencies.
#
# This is not minimalism for its own sake. A supply-chain scanner that pulls a
# transitive dependency tree is asking to become the incident it was bought to
# prevent, and every dependency here would appear in the SBOM of every customer
# who installs it. It also makes the air-gapped story a single wheel with nothing
# to vendor, and it makes `pip download` reproducible without a resolver.
#
# Everything optional lives in [project.optional-dependencies] and MUST degrade
# to a documented reduced capability rather than an error. If a feature cannot
# degrade, it does not belong in an extra.
dependencies = []

[project.optional-dependencies]
# JS/TS semantic resolution for the `kind: ast` match kind. The base install
# resolves Python calls through the stdlib `ast`; this extra adds a tree-sitter
# provider so the same `kind: ast` rules resolve JavaScript and TypeScript calls
# through their imports and aliases too. It degrades as promised: without it, a
# JS/TS file is still scanned by the regex tier, the ast rules simply add
# nothing, and `detect/ast_providers` reports the language as having no provider
# rather than treating it as fully analysed. The dependency lives here, never in
# the base, so the zero-required-dependency guarantee holds.
ast-js = [
    "tree-sitter>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Distributes the suite across CPU cores with `-n auto`, for fast local
    # iteration. The timing-sensitive perf tests are kept out of a parallel run,
    # where CPU contention would make their wall-clock assertions flap.
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    # The test environment carries the ast-js provider so the bundled JS `kind:
    # ast` rules are validated here rather than shipping unchecked.
    "tree-sitter>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
]

[project.scripts]
cordon-scanner = "cordon_scanner.cli.main:main"
# The runtime-analysis component. A separate entry point on purpose: the
# scanner never executes what it scans, and this does, so the two must not be
# reachable through the same command. It refuses to do anything without an
# explicit flag, and refuses again if isolation cannot be established.
cordon-sandbox = "cordon_sandbox.cli:main"

[project.entry-points."cordon_scanner.detectors"]
# Built-in detectors register through the same entry-point mechanism third-party
# detectors use. There is no privileged path: if the plugin system is broken for
# third parties, it is broken for us too, and we find out immediately.
advisory = "cordon_scanner.detect.advisory:AdvisoryDetector"
attestation = "cordon_scanner.detect.attestation:AttestationDetector"
binary = "cordon_scanner.detect.binary:BinaryDetector"
capability = "cordon_scanner.detect.capability:CapabilityDetector"
config = "cordon_scanner.detect.config_files:ConfigDetector"
dependency = "cordon_scanner.detect.dependency:DependencyDetector"
license = "cordon_scanner.detect.license:LicenseDetector"
lockfile = "cordon_scanner.detect.lockfile:LockfileDetector"
manifest = "cordon_scanner.detect.manifest:ManifestDetector"
obfuscation = "cordon_scanner.detect.obfuscation:ObfuscationDetector"
registry = "cordon_scanner.detect.registry:RegistryDetector"
sbom = "cordon_scanner.detect.sbom:SbomDetector"
secrets = "cordon_scanner.detect.secrets:SecretDetector"
vcs = "cordon_scanner.detect.vcs:VcsDetector"

[project.entry-points."cordon_scanner.reporters"]
text = "cordon_scanner.report.text:TextReporter"
json = "cordon_scanner.report.json_:JsonReporter"
sarif = "cordon_scanner.report.sarif:SarifReporter"
junit = "cordon_scanner.report.junit:JunitReporter"
markdown = "cordon_scanner.report.markdown:MarkdownReporter"
github = "cordon_scanner.report.github:GithubReporter"

[project.urls]
Homepage = "https://github.com/Threx-code/cordon"
Documentation = "https://github.com/Threx-code/cordon#readme"
Repository = "https://github.com/Threx-code/cordon.git"
"Bug Tracker" = "https://github.com/Threx-code/cordon/issues"
Changelog = "https://github.com/Threx-code/cordon/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "cordon_scanner.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cordon_scanner*", "cordon_sandbox*"]

[tool.setuptools.package-data]
"cordon_scanner" = ["py.typed"]
"cordon_sandbox" = ["py.typed"]
"cordon_scanner.rules.builtin" = ["*.yaml"]
# The generated package-name allowlist. A wheel without it falls back to the
# curated sets in `intel/real.py`, which is a working scanner with a far smaller
# allowlist -- so the consequence of leaving this out is not a crash, it is
# typosquat false positives on real packages in every install. Declared here as
# well as in MANIFEST.in because the two govern different artefacts: MANIFEST.in
# the sdist, this the wheel.
#
# `*.json` is the OSV-derived advisory database (scripts/build_advisory_db.py)
# plus its build-metadata sidecar. A wheel without it falls back to the small
# hand-curated `BUNDLED` set in `intel/advisories.py` -- again not a crash,
# but the difference between real vulnerability coverage and nine records.
"cordon_scanner.intel.data" = ["*.txt", "*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "S",    # bandit: this project must pass its own class of check
    "PTH",  # use pathlib
    "RET",  # return consistency
]
ignore = [
    "E501",  # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct hostile input and assert on it.
#   S101 assert          - the point of a test
#   S105/S106            - fabricated credential shapes, none of them live
#   S108 /tmp paths      - fixtures
#   S314 xml parsing     - parsing output this project generated, not input
#   S603/S607 subprocess - driving git to build a real repository fixture
"tests/**" = ["S101", "S105", "S106", "S108", "S314", "S603", "S607"]
# The corpus is sample data, not source. It is never imported.
"corpus/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["cordon_scanner"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/cordon_scanner"]

[[tool.mypy.overrides]]
module = ["tree_sitter.*", "tree_sitter_languages.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `tests/support.py` is importable as `support` without making `tests` a
# package, which would change collection semantics for every file in it.
pythonpath = ["tests"]
addopts = [
    # Deselected by default. `perf` generates fifty thousand files, `fuzz`
    # explores for hundreds of examples, and `network` reaches an upstream --
    # none belongs in the run a developer does on every save. Each has its own
    # CI job that selects it explicitly, and a command-line `-m` overrides this
    # one because pytest takes the last such option.
    "-m",
    "not perf and not fuzz and not network",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
]
markers = [
    "slow: long-running tests, deselect with -m 'not slow'",
    "corpus: runs against the sample corpus",
    "hostile: feeds the scanner input designed to attack it",
    "perf: performance budget assertions",
    "network: checks bundled data against a live upstream; deselected by default",
    "fuzz: property tests over arbitrary bytes; deselected by default",
]

[tool.coverage.run]
source = ["src/cordon_scanner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
