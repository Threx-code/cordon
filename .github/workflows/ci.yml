# Cordon's own continuous integration.
#
# Not to be confused with `action/action.yml`, which is the Action published for
# other people to run in their repositories. This file tests the tool; that file
# ships it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Any job needing more declares it itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The OS belongs in the name. Nine jobs shared three names, so a failure
    # could not be attributed to a platform without opening the API, and the
    # CLI returned a different job's log for the same name.
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      # Actions pinned by commit SHA, not tag. A tag is mutable, so a
      # tag-pinned action is code that can change without a commit -- which is
      # one of the things Cordon reports in other people's workflows.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=cordon_scanner --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/cordon_scanner

  rules:
    name: rule self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The mechanism that makes an inert rule impossible to ship. A detection
      # rule fails silently by nature: it stops matching, the scan still
      # succeeds, and the gate looks green precisely because the check is
      # broken.
      - run: cordon-scanner rules test

  self-scan:
    name: cordon scans cordon
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      # A security tool that cannot pass its own checks has no standing to
      # enforce them. The corpus is excluded because it contains deliberate
      # payloads whose whole purpose is to be detected.
      - run: |
          cordon-scanner scan . \
            --exclude 'corpus/**' \
            --fail-on medium \
            --no-color \
            --format text \
            --format sarif:cordon.sarif
      - if: always() && hashFiles('cordon.sarif') != ''
        uses: github/codeql-action/upload-sarif@f779452ac5af1c261dce0346a8f964149f49322b # v3.26.13
        with:
          sarif_file: cordon.sarif
          category: cordon-self

  determinism:
    name: output is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Baselines, incremental caching and reproducible gates all rest on this,
      # so it is asserted rather than assumed.
      - run: |
          cordon-scanner scan corpus --format json --output a.json --quiet --no-cache || true
          cordon-scanner scan corpus --format json --output b.json --quiet --no-cache || true
          # Findings only. A scan duration and cache statistics are observations
          # of one particular run and legitimately differ; determinism is a claim
          # about what was found, not about how long it took.
          python - <<'PY'
          import json, sys
          a = json.load(open("a.json"))["findings"]
          b = json.load(open("b.json"))["findings"]
          if a != b:
              print("::error::scan output is not reproducible")
              sys.exit(1)
          print(f"{len(a)} findings, identical across runs")
          PY
      - run: |
          # A warm cache must produce exactly what a cold scan produced. If it
          # does not, the cache is returning results computed under different
          # conditions, which is a false negative waiting to happen.
          cordon-scanner scan corpus --format json --output cold.json --quiet --no-cache || true
          cordon-scanner scan corpus --format json --output warm1.json --quiet || true
          cordon-scanner scan corpus --format json --output warm2.json --quiet || true
          python - <<'PY'
          import json, sys
          cold = json.load(open("cold.json"))["findings"]
          warm = json.load(open("warm2.json"))["findings"]
          if cold != warm:
              print("::error::cached results differ from a cold scan")
              sys.exit(1)
          print("cache hit is identical to a cold run")
          PY

  performance:
    name: latency budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Latency is a security property: a commit-time guard slower than about a
      # second gets `--no-verify`, and a bypassed guard protects nothing. The
      # budgets were written in docs/04-OPERATIONS.md and never measured, which
      # is the same failure in a different place -- a number nobody checks is a
      # number nobody meets.
      #
      # Asserted at the hard ceilings, not the targets. Shared runners are too
      # variable for a 300ms assertion, and a check that fails at random is one
      # people learn to re-run rather than read. The measurement is printed, so
      # a regression toward a ceiling is visible in the log first.
      - run: pytest -q -m perf -s tests/perf/
