name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Any job needing more declares it itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      # Actions pinned by commit SHA, not tag. A tag is mutable, so a
      # tag-pinned action is code that can change without a commit -- which is
      # one of the things Cordon reports in other people's workflows.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=cordon --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/cordon || true  # advisory until the annotation pass lands

  rules:
    name: rule self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The mechanism that makes an inert rule impossible to ship. A detection
      # rule fails silently by nature: it stops matching, the scan still
      # succeeds, and the gate looks green precisely because the check is
      # broken.
      - run: cordon rules test

  self-scan:
    name: cordon scans cordon
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      # A security tool that cannot pass its own checks has no standing to
      # enforce them. The corpus is excluded because it contains deliberate
      # payloads whose whole purpose is to be detected.
      - run: |
          cordon scan . \
            --exclude 'corpus/**' \
            --fail-on medium \
            --no-color \
            --format text \
            --format sarif --output cordon.sarif
      - if: always() && hashFiles('cordon.sarif') != ''
        uses: github/codeql-action/upload-sarif@f779452ac5af1c261dce0346a8f964149f49322b # v3.26.13
        with:
          sarif_file: cordon.sarif
          category: cordon-self

  determinism:
    name: output is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Baselines, incremental caching and reproducible gates all rest on this,
      # so it is asserted rather than assumed.
      - run: |
          cordon scan corpus --format json --output a.json --quiet || true
          cordon scan corpus --format json --output b.json --quiet || true
          diff a.json b.json && echo "output is byte-identical across runs"
      - run: |
          cordon scan corpus --format json --output serial.json --jobs 1 --quiet || true
          diff a.json serial.json && echo "parallel and serial results agree"
