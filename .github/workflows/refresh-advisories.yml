name: refresh-advisory-database

# Keeps the shipped vulnerability/malicious-package database current. Same
# arrangement as refresh-package-intel.yml, and for the same reason:
# `intel/data/advisories-*.json` is bundled content that decides what a scan
# reports, so it is refreshed like a dependency bump -- a pull request a human
# reads -- never edited in place or pushed straight to a release branch.
#
# Why it has to be refreshed at all: `AdvisoryDatabase.bundled()` is what
# backs `MALWARE.DEPENDENCY.KNOWN.001` and `VULNERABLE.DEPENDENCY.KNOWN.001`.
# A snapshot that never updates goes stale the day after it ships, the same
# way Trivy's and Grype's own cached databases would if nothing ever refreshed
# them -- this is that refresh step, not a live query, so a scan stays offline
# and reproducible either way.

on:
  schedule:
    # Weekly, same cadence as refresh-package-intel.yml. OSV's exporters
    # update continuously, but a scan's data does not need to be hours old to
    # be useful -- it needs to not be measured in release cycles.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-advisory-database
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh the advisory database and open a pull request
    runs-on: ubuntu-latest
    # Nine ecosystem exports, the largest tens of megabytes compressed. Ample
    # room over the ~20s this takes against a warm connection; bounded so a
    # wedged download reports as a failure rather than eating the runner's
    # default six hours, the same lesson refresh-package-intel.yml's own
    # comment names.
    timeout-minutes: 30
    if: github.repository == 'Threx-code/cordon'
    permissions:
      contents: write
      # `issues: write`, not `pull-requests: write`. This job pushes a branch
      # and says so in an issue; it never opens or approves a pull request, so
      # it does not need -- and must not have -- the permission that would let
      # it approve one.
      issues: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Refresh from OSV's bulk export
        # Talks only to osv-vulnerabilities.storage.googleapis.com (see
        # intel/osv_import.py's fixed host allowlist), an unauthenticated
        # public bucket, so there is no secret in this job. All-or-nothing:
        # `build_advisory_db.py` writes nothing if any ecosystem fails, so a
        # partial run never produces a diff that looks like six ecosystems
        # losing their advisories.
        timeout-minutes: 20
        run: python3 scripts/build_advisory_db.py

      - name: Check the result is still well formed
        run: pytest -q tests/unit/test_osv_import.py tests/integration/test_review_advisories.py

      - name: Confirm a known incident is still reachable
        # The failure direction nobody would notice: a refresh that silently
        # drops event-stream's GHSA (or any BUNDLED entry) still leaves a
        # database that loads and looks populated. BUNDLED itself is
        # untouched by this job, but the merge in `bundled()` is exactly what
        # a `(ecosystem, identifier)` dedup regression would break quietly.
        run: |
          python - <<'PY'
          import sys

          from cordon_scanner.intel.advisories import AdvisoryDatabase

          db = AdvisoryDatabase.bundled()
          if not db.matching("npm", "event-stream", "3.3.6"):
              print("::error::event-stream 3.3.6 no longer matches after the refresh")
              sys.exit(1)
          print(f"{len(db)} advisories, event-stream 3.3.6 still matches")
          PY

      - name: Summarise the change for the reviewer
        id: summary
        run: |
          {
            echo "### Advisory database movement"
            echo
            echo "| ecosystem | advisories | change |"
            echo "| --- | --- | --- |"
            # The per-ecosystem data is gzipped. This globbed `*.json`, which
            # matches the two sidecars and none of the data, so the table
            # counted the digest manifest and called it an ecosystem.
            count='import gzip,json,sys; print(len(json.load(gzip.open(sys.argv[1],"rt",encoding="utf-8"))))'
            count_stdin='import gzip,io,json,sys; print(len(json.load(gzip.GzipFile(fileobj=io.BytesIO(sys.stdin.buffer.read())))))'
            for file in src/cordon_scanner/intel/data/advisories-*.json.gz; do
              eco=$(basename "$file" .json.gz | sed 's/^advisories-//')
              now=$(python3 -c "$count" "$file")
              was=$(git show "HEAD:$file" 2>/dev/null | python3 -c "$count_stdin" 2>/dev/null || echo 0)
              printf '| %s | %s | %+d |\n' "$eco" "$now" "$((now - was))"
            done
            echo
            meta="src/cordon_scanner/intel/data/advisories-meta.json"
            if [ -f "$meta" ]; then
              echo "### Metadata"
              echo
              echo '```json'
              cat "$meta"
              echo '```'
            fi
          } > advisory-summary.md
          cat advisory-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Push the refreshed data to its own branch
        # Not a pull request, and the reason is a GitHub limitation rather than
        # a preference: "create a pull request" and "approve a pull request" are
        # one repository toggle. Granting it so this job can open a PR also lets
        # any workflow approve one, which is precisely the control the review is
        # there to provide -- an attacker able to trigger a workflow could have
        # it approve their own change.
        #
        # So this pushes a branch and the next step opens an issue pointing at
        # it. A person opens the pull request, so the PR is authored by somebody
        # who can be required to get a review, and never by the thing that wrote
        # the commit.
        id: push
        env:
          BRANCH: chore/refresh-advisory-database
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Both spellings. The data is `advisories-<ecosystem>.json.gz`
          # and only the two sidecars are plain `.json`, so a glob of
          # `advisories-*.json` commits a digest manifest for data it has
          # left behind -- and the load path then refuses the lot.
          git add -- src/cordon_scanner/intel/data/advisories-*.json \
                     src/cordon_scanner/intel/data/advisories-*.json.gz
          # `git diff --cached --quiet` cannot answer this. The metadata sidecar stamps every run with the time it ran, so the index
          # always differs and the guard never fires -- which is how a no-op
          # refresh came to open a pull request and file an issue every week.
          # This asks the narrower question the reviewer actually cares about:
          # did the data move, and if not, is the recorded date stale enough to
          # be worth refreshing on its own.
          verdict=$(python3 scripts/refresh_movement.py \
            --data 'src/cordon_scanner/intel/data/advisories-*.json.gz' \
            --stamp src/cordon_scanner/intel/data/advisories-meta.json \
            --confirm-after-days 30)
          echo "movement: $verdict"
          if [ "$verdict" = "none" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing moved; no branch pushed."
            exit 0
          fi
          git commit -q -m "Refresh the OSV-derived advisory database"
          # Force, because the branch is the current refresh rather than a stack
          # of every refresh nobody merged.
          git push -q --force origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Say that it is waiting
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/refresh-advisory-database
        run: |
          set -euo pipefail
          compare="${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"
          summary=$(cat advisory-summary.md 2>/dev/null || echo "")
          {
            echo "The refresh ran and pushed \`$BRANCH\`."
            echo
            echo "**[Open the pull request]($compare)**"
            echo
            echo "It is not opened automatically. GitHub bundles \"create a pull"
            echo "request\" with \"approve a pull request\" into one repository"
            echo "setting, and granting that would let any workflow approve a"
            echo "change -- including one it wrote. A person opens this, so the"
            echo "review it needs is a review somebody else has to give."
            echo
            echo "$summary"
          } > issue.md
          gh label create "advisories" --color ededed \
            --description "Bundled data refreshed on a schedule" 2>/dev/null || true
          existing=$(gh issue list --state open --label "advisories" \
            --search "Advisory database refresh is ready to review in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue.md
            echo "updated issue #$existing"
          else
            gh issue create --title "Advisory database refresh is ready to review" --label "advisories" --body-file issue.md
          fi || {
            echo "::warning::the branch is pushed; the notice could not be"
            echo "::warning::written. Open the pull request from the compare"
            echo "::warning::link above."
          }
