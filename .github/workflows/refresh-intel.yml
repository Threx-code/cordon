name: refresh-package-intel

# Keeps the shipped allowlist of established package names from rotting.
#
# `intel/data/` is the only bundled data whose contents can REMOVE a detection, so
# it gets the same treatment as a dependency bump rather than being edited in
# place: this job refreshes it, opens a pull request, and a human reads the diff.
# It never pushes to a branch anybody releases from.
#
# Why it has to be refreshed at all: the allowlist is what stops
# SUSPECT.DEPENDENCY.TYPOSQUAT.001 accusing a real maintainer's package. Registries
# gain packages every day, and a name that is popular in a year and absent from
# this file is a high-severity false accusation waiting to happen - which is
# exactly how `psycopg` and `colord` were reported before the file existed. A
# stale allowlist degrades quietly and in one direction.

on:
  schedule:
    # Monday morning, so a pull request lands when somebody is there to read it,
    # and weekly because registry popularity moves on the scale of months.
    - cron: "0 6 * * 1"
  # So a maintainer can refresh on demand without waiting for Monday, which is
  # also the only way to test a change to the script itself.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One refresh at a time. Two overlapping runs would race on the same branch and
  # the loser would silently produce a pull request missing half the ecosystems.
  group: refresh-package-intel
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh the allowlist and open a pull request
    runs-on: ubuntu-latest
    # Without this the job inherits the six-hour default, and six hours is how
    # this once failed: the runner sent SIGTERM at the limit and the step
    # reported exit 143 with no output saying which registry was slow. Every
    # source is now a bounded fetch -- a published dataset (PyPI, npm) or a small
    # paginated crawl (crates, NuGet, Packagist, RubyGems, pub.dev) -- so the
    # whole refresh finishes in minutes; this bound is a backstop, and a job that
    # hits it means a source is wedged, not that the work is genuinely that long.
    timeout-minutes: 45
    # Only on the canonical repository. A fork that enables Actions would
    # otherwise run this weekly against seven registries for no reason, and open
    # pull requests nobody asked for.
    if: github.repository == 'Threx-code/cordon'
    permissions:
      contents: write
      # `issues: write`, not `pull-requests: write`. This job pushes a branch
      # and says so in an issue; it never opens or approves a pull request, so
      # it does not need -- and must not have -- the permission that would let
      # it approve one.
      issues: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Refresh from the registries
        # The script talks to seven public registries and no authenticated API, so
        # there is no secret in this job and nothing for a compromised dependency
        # in the refresh to exfiltrate. It writes only under
        # `src/cordon_scanner/intel/data/`.
        #
        # Not `continue-on-error`. A failed source must not silently ship: the
        # script keeps the existing file for any ecosystem whose fetch failed or
        # whose result shrank past the guard, refreshes the rest, and exits
        # non-zero if any failed -- so a red run means "one source needs a look",
        # while the file it could not refresh safely keeps its last-good state.
        # Bounded here as a backstop against a process wedged where nothing else
        # checks the clock.
        timeout-minutes: 35
        run: python3 scripts/refresh_package_intel.py

      - name: Check the result is still well formed
        # The same assertions CI runs, before anything is proposed rather than
        # after. A source that starts serving an error page parses into entries
        # that look like package names, and the tests are what notice.
        run: pytest -q tests/unit/test_package_intel.py

      - name: Confirm the allowlist did not swallow a known squat
        # The failure direction nobody would notice. A missing name costs a false
        # accusation and somebody complains within a day; a name wrongly PRESENT
        # costs a missed squat, and the rule goes on running and reporting nothing.
        #
        # Asserted here as well as in the suite because this is the one job that
        # changes the file, and `tdqm` is the live case: a real PyPI typosquat of
        # `tqdm` with enough installs to clear any download threshold, held out by
        # the look-alike filter alone.
        run: |
          python - <<'PY'
          import sys

          from cordon_scanner.intel.popular import PackageIntel

          squats = [
              ("pypi", "tdqm", "tqdm"),
              ("pypi", "requsts", "requests"),
              ("npm", "lodahs", "lodash"),
              ("cargo", "cfg-iif", "cfg-if"),
          ]
          bad = [
              f"{name} (imitates {target})"
              for eco, name, target in squats
              if PackageIntel.is_known_package(eco, name)
          ]
          if bad:
              print(f"::error::the refresh allowlisted known squats: {', '.join(bad)}")
              sys.exit(1)
          print(f"{len(squats)} known squats still reportable")
          PY

      - name: Summarise the change for the reviewer
        id: summary
        # What a reviewer needs in order to judge a fifty-thousand-line diff: the
        # net movement per ecosystem, and the full list of names the look-alike
        # filter refused. The refusals are the part worth reading - each is either a
        # squat the filter caught or a real package it got wrong.
        run: |
          {
            echo "### Allowlist movement"
            echo
            echo "| ecosystem | names | change |"
            echo "| --- | --- | --- |"
            for file in src/cordon_scanner/intel/data/*.txt; do
              case "$file" in *.refused.txt) continue ;; esac
              eco=$(basename "$file" .txt)
              now=$(grep -vc '^#' "$file" || echo 0)
              was=$(git show "HEAD:$file" 2>/dev/null | grep -vc '^#' || echo 0)
              printf '| %s | %s | %+d |\n' "$eco" "$now" "$((now - was))"
            done
            echo
            echo "### Refused as look-alikes"
            echo
            echo "Each is either a squat the filter caught, or a real package it got"
            echo "wrong. A real one belongs in \`KEEP_DESPITE_SHAPE\` with a reason."
            echo
            echo '```'
            grep -h -v '^#' src/cordon_scanner/intel/data/*.refused.txt | sort || true
            echo '```'
          } > intel-summary.md
          cat intel-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Push the refreshed data to its own branch
        # Not a pull request, and the reason is a GitHub limitation rather than
        # a preference: "create a pull request" and "approve a pull request" are
        # one repository toggle. Granting it so this job can open a PR also lets
        # any workflow approve one, which is precisely the control the review is
        # there to provide -- an attacker able to trigger a workflow could have
        # it approve their own change.
        #
        # So this pushes a branch and the next step opens an issue pointing at
        # it. A person opens the pull request, so the PR is authored by somebody
        # who can be required to get a review, and never by the thing that wrote
        # the commit.
        id: push
        env:
          BRANCH: chore/refresh-package-intel
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The generated ecosystem table carries the per-ecosystem
          # allowlist counts, so it moves with the lists or the suite
          # fails on the next push with nothing to do with this refresh.
          PYTHONPATH=src:tests python tests/ecosystems.py > docs/07-ECOSYSTEMS.md
          git add -- src/cordon_scanner/intel/data/*.txt docs/07-ECOSYSTEMS.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing moved; no branch pushed."
            exit 0
          fi
          git commit -q -m "Refresh the established-package allowlist from the registries"
          # Force, because the branch is the current refresh rather than a stack
          # of every refresh nobody merged.
          git push -q --force origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Say that it is waiting
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/refresh-package-intel
        run: |
          set -euo pipefail
          compare="${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"
          summary=$(cat intel-summary.md 2>/dev/null || echo "")
          {
            echo "The refresh ran and pushed \`$BRANCH\`."
            echo
            echo "**[Open the pull request]($compare)**"
            echo
            echo "It is not opened automatically. GitHub bundles \"create a pull"
            echo "request\" with \"approve a pull request\" into one repository"
            echo "setting, and granting that would let any workflow approve a"
            echo "change -- including one it wrote. A person opens this, so the"
            echo "review it needs is a review somebody else has to give."
            echo
            echo "$summary"
          } > issue.md
          existing=$(gh issue list --state open --label "package-intel" \
            --search "Package allowlist refresh is ready to review in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue.md
            echo "updated issue #$existing"
          else
            gh issue create --title "Package allowlist refresh is ready to review" --label "package-intel" --body-file issue.md
          fi
