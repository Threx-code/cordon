name: release

# Cutting a release is where the hash pin the Action installs from comes from,
# so the ordering below is the security-relevant part rather than incidental:
#
#   build  ->  pin from the built artefacts  ->  publish those same artefacts
#          ->  confirm the index serves what was uploaded
#
# The pin is taken from the files being published, not from a rebuild, so it is
# correct by construction and depends on no build being byte-reproducible. The
# final step then reads the digests back from PyPI and fails if they differ,
# which catches an upload that did not land as sent.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true

permissions:
  contents: read

jobs:
  # Before anything is built, let alone published. These need a live registry
  # so they cannot live in `ci.yml`, and the defects they catch -- an
  # attestation verifier that rejects every genuine bundle, a hash comparison
  # that fires on every correct Yarn Berry lockfile -- are precisely the kind
  # that a green offline suite says nothing about.
  live:
    uses: ./.github/workflows/live-checks.yml

  build:
    needs: live
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - id: version
        run: |
          set -euo pipefail
          version=$(python -c "import sys; sys.path.insert(0,'src'); from cordon_scanner.version import __version__; print(__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tag that disagrees with the package version produces a release
          # whose artefacts are named one thing and referred to as another.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi

      - id: published
        name: Does the index already have this version
        run: |
          set -euo pipefail
          # The last step of a release is to commit the pin and move the tag onto
          # that commit, which pushes the tag a second time and runs this workflow
          # again. The files are already on the index by then, so a second upload
          # is rejected and the release goes red for having followed its own
          # instructions. A second run verifies instead: `confirm` still reads the
          # digests back and still fails if they disagree with the committed pin.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/cordon-scanner/${{ steps.version.outputs.version }}/json")
          case "$code" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            # Anything else is the index being unreachable or unwell, and guessing
            # either way is worse than stopping: guessing "false" uploads into an
            # unknown state, guessing "true" skips a release that never happened.
            *) echo "::error::PyPI returned $code for cordon-scanner ${{ steps.version.outputs.version }}"; exit 1 ;;
          esac

      - name: Install the build toolchain, pinned by hash
        # Not `pipx run build`, which resolves from PyPI at release time,
        # unpinned and unhashed -- so a compromised `build` or `setuptools`
        # release would execute inside the job that holds the publishing
        # identity. For this project specifically, that is the whole attack.
        run: pip install --require-hashes -r requirements-build.txt

      - run: |
          # A fixed timestamp makes the wheel byte-reproducible, so a third
          # party can rebuild from the tag and compare digests with the SBOM.
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) python -m build --no-isolation

      - name: Generate the SBOM
        run: |
          set -euo pipefail
          # "Zero third-party runtime dependencies" is a claim, and a claim a
          # consumer cannot check is marketing. This is the checkable form, and
          # it is generated from the packaging metadata rather than restated, so
          # a dependency added later appears without anyone remembering to.
          python scripts/generate_sbom.py --check
          python scripts/generate_sbom.py --dist dist --out dist
          cat dist/sbom.cdx.json

      - name: What this release adds, compared with the one before it
        # `--compare-with`: the built wheel against the previous release's wheel from PyPI. A new
        # install hook, new network or execution capability, new obfuscation or a new binary in
        # the scanner itself is a finding, and it blocks the release at high and above. The
        # previous wheel is fetched by pip; the scanner itself makes no network request.
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          current=$(basename "$wheel" | sed -E 's/^cordon_scanner-([^-]+)-.*/\1/')
          python -m venv /tmp/cordon-release
          /tmp/cordon-release/bin/pip install -q --no-deps "$wheel"
          previous=$(python3 - "$current" <<'PY'
          import json, sys, urllib.request
          cur = tuple(int(x) for x in sys.argv[1].split(".")[:3])
          releases = json.load(urllib.request.urlopen("https://pypi.org/pypi/cordon-scanner/json"))["releases"]
          older = sorted(
              (tuple(int(x) for x in v.split(".")), v)
              for v, files in releases.items()
              if files and all(p.isdigit() for p in v.split(".")) and tuple(int(x) for x in v.split(".")) < cur
          )
          print(older[-1][1] if older else "")
          PY
          )
          echo "this release: $current, the one before it: ${previous:-none}"
          [ -n "$previous" ] || exit 0
          pip download -q --no-deps --only-binary :all: "cordon-scanner==$previous" -d /tmp/previous-release
          /tmp/cordon-release/bin/cordon-scanner scan "$wheel" \
            --compare-with /tmp/previous-release/*.whl --no-color --format text --format github

      - name: Generate the Action's hash pin
        run: |
          set -euo pipefail
          python scripts/pin_action_requirements.py \
            --version "${{ steps.version.outputs.version }}" --from-dist dist
          cat action/requirements.txt

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: |
            dist/
            action/requirements.txt

  image:
    name: build and publish the container image
    needs: build
    if: needs.build.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To push to this repository's own GitHub Container Registry namespace,
      # using the workflow's own token rather than a long-lived credential.
      packages: write
      # Both required to mint a signing certificate from the workflow's own
      # identity, the same keyless arrangement `attest` below uses -- no key
      # exists anywhere, so no key can be stolen.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - id: repo
        # ghcr.io requires a lowercase path; `github.repository` is this
        # repository's actual case ("Threx-code/cordon").
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.repo.outputs.lower }}
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Self-hosted runners and developer machines are as often arm64 as amd64 (audit PK-04).
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - id: runner
        # The runner variant: the same scanner with git, which the distroless image cannot clone
        # without (audit PK-04). See ci/runner/Dockerfile.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/runner/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}-runner:${{ needs.build.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.lower }}-runner:latest

      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.lower }}-runner
          subject-digest: ${{ steps.runner.outputs.digest }}
          push-to-registry: true

      - name: SLSA build provenance for the image
        # The same tool `attest` below uses for the wheel and sdist, bound to
        # the image's own digest instead. `push-to-registry` attaches it to
        # the manifest itself, so `docker buildx imagetools inspect` on the
        # published tag shows it with no separate fetch.
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.lower }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        # Signs the digest, not the tag: a tag is mutable and a signature over
        # one would say nothing about what a puller actually receives.
        run: |
          cosign sign --yes "ghcr.io/${{ steps.repo.outputs.lower }}@${{ steps.push.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ steps.repo.outputs.lower }}-runner@${{ steps.runner.outputs.digest }}"

  advisory-bundle:
    name: build, sign and publish the advisory database bundle
    needs: build
    if: needs.build.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      # To upload the bundle and its signature as assets on this tag's release.
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      # `cryptography` is a RELEASE-only dependency: it signs the bundle here and
      # never ships. The scanner verifies with the vendored `intel/_ed25519`.
      - run: pip install "cryptography>=42"
      - name: Build and sign the bundle
        # Skips cleanly when the signing key is not yet configured, so the
        # release itself is never blocked on this opt-in feature being set up.
        # The key is a 32-byte Ed25519 seed in the secret; its public half is
        # pinned in `intel/dbsync.PUBLIC_KEY_HEX`.
        env:
          CORDON_DB_SIGNING_KEY: ${{ secrets.CORDON_DB_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CORDON_DB_SIGNING_KEY:-}" ]; then
            echo "::notice::CORDON_DB_SIGNING_KEY is not set; skipping the advisory bundle"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # The bundle is the whole of OSV, every severity: it is what an air-gapped install
          # syncs from instead of the network, and the wheel's high/critical cut is a size
          # trade-off for the wheel, not for the one source an offline machine has.
          python3 scripts/build_advisory_db.py --full --output bundle-data
          for intel in hallucinated.json agent-actions.json vscode-extensions.json atr-rules.json.gz; do
            cp "src/cordon_scanner/intel/data/$intel" bundle-data/
          done
          test -f bundle-data/exploited.json || cp src/cordon_scanner/intel/data/exploited.json bundle-data/
          python3 scripts/sign_advisory_bundle.py \
            --data-dir bundle-data \
            --out dist-bundle
      - name: Upload the bundle to the release
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist-bundle/cordon-advisories.tar.gz \
            dist-bundle/cordon-advisories.tar.gz.sig \
            --clobber

  attest:
    needs: build
    if: needs.build.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both required to mint a signing certificate from the workflow's own
      # identity. No key exists anywhere, so no key can be stolen.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist

      - name: SLSA build provenance
        # Binds each artefact to the workflow, repository, commit and runner
        # that produced it. Answers a question a signature alone does not: not
        # "was this signed by the project" but "was this built by the process
        # the project describes".
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"

      - name: Sign the artefacts and the SBOM
        # Keyless. The certificate is bound to this workflow's identity and is
        # valid for minutes, so there is no signing key to protect, rotate, or
        # leak -- which is the failure mode that has ended other projects.
        uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46 # v3.0.0
        with:
          inputs: dist/*.whl dist/*.tar.gz dist/sbom.cdx.json dist/sbom.spdx.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signed
          path: dist/

  publish:
    needs: [build, attest]
    if: needs.build.outputs.published == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: no long-lived token exists to be stolen.
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
      - name: Keep only what PyPI accepts
        # The SBOM, its signatures and the Action pin travel with the release on
        # GitHub, not to the index, which rejects an upload containing anything
        # that is not a distribution.
        run: |
          set -euo pipefail
          mkdir -p upload
          mv dist/*.whl dist/*.tar.gz upload/ 2>/dev/null || mv *.whl *.tar.gz upload/
          ls -l upload
      # v1.12.2 was pinned here and could not read the wheel this project
      # builds. `setuptools` 80 writes `Metadata-Version: 2.4`; the `pkginfo`
      # inside that image predates it, so it parsed no fields and reported
      # "Metadata is missing required fields: Name, Version" for a wheel whose
      # first three lines are the metadata version, the name and the version.
      # Local `twine check` passed throughout, because local twine is current
      # -- the disagreement was between the builder and the publisher, and a
      # pin is exactly the thing that lets those drift apart.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload
          # PEP 740 attestations, minted from the same workflow identity, so an
          # installer can verify provenance from the index itself.
          attestations: true

  confirm:
    needs: [build, publish]
    # Skipped upstream jobs report `skipped`, not `success`, so an ordinary `needs`
    # would skip this too -- and the verification run would verify nothing.
    if: >-
      !cancelled() && needs.build.result == 'success'
      && needs.publish.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          # Into a subdirectory, NOT over the checkout. The artefact carries the
          # build's own `action/requirements.txt`, and unpacking it at the root
          # overwrote the committed one -- so the check below compared the index
          # against a pin generated moments earlier instead of against the pin
          # this repository actually ships.
          #
          # It only shows up on the verification run, and it is guaranteed
          # there: `build` runs unconditionally and takes SOURCE_DATE_EPOCH from
          # `git log -1`, so moving the tag onto the pin commit rebuilds with a
          # different timestamp and produces different digests by construction.
          # 0.3.0 was published correctly and this reported it as a mismatch.
          path: artefacts

      - name: The index serves what was uploaded
        run: |
          set -euo pipefail
          # Reads the digests PyPI reports and compares them with the pin taken
          # from the artefacts before upload. A difference means the file that
          # landed is not the file that was sent.
          python scripts/pin_action_requirements.py \
            --version "${{ needs.build.outputs.version }}" --from-pypi --check

      - name: What to commit
        run: |
          set -euo pipefail
          if [ "${{ needs.build.outputs.published }}" = "true" ]; then
            echo "Verification run: the index already served this version, nothing was uploaded,"
            echo "and the committed pin below matches what it serves."
            cat action/requirements.txt
          else
            echo "Commit this as action/requirements.txt and move the release tag onto that"
            echo "commit, so that pinning this Action by SHA also pins what pip downloads."
            # From the artefact, because on the release that PUBLISHES a version
            # the repository has no pin yet -- that is the whole ordering.
            cat artefacts/action/requirements.txt
          fi

  pipe-image:
    name: build and publish the Bitbucket pipe image
    # After `confirm`, which waits until PyPI serves this version with the digests the pin names:
    # the image installs the published wheel through that pin and nothing else.
    needs: [build, confirm]
    if: needs.build.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: artefacts

      - name: Use this release's pin
        # The repository commits the pin after the release, so the checkout does not have it yet.
        run: |
          set -euo pipefail
          cp artefacts/action/requirements.txt action/requirements.txt
          cat action/requirements.txt

      - name: Wait until pip can resolve this pin
        # `confirm` reads PyPI's JSON API. pip reads the simple index, which a CDN serves and
        # which can lag the upload by many minutes: 0.5.1's pipe image failed twice with "No
        # matching distribution found for cordon-scanner==0.5.1" while the JSON API already
        # listed it. Wait for the index pip actually uses, then fail plainly.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if python3 -m pip download --quiet --disable-pip-version-check --no-cache-dir \
                 --require-hashes --no-deps -r action/requirements.txt -d "$RUNNER_TEMP/pin-check"; then
              exit 0
            fi
            echo "::notice::the index does not serve the pinned version yet (attempt ${attempt}/40); waiting 30s"
            sleep 30
          done
          echo "::error::PyPI's simple index still does not serve the pinned version after 20 minutes"
          exit 1

      - id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/bitbucket/Dockerfile
          push: true
          # The name `ci/bitbucket/pipe.yml` points Bitbucket at.
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}-bitbucket-pipe:${{ needs.build.outputs.version }}

      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.lower }}-bitbucket-pipe
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        run: cosign sign --yes "ghcr.io/${{ steps.repo.outputs.lower }}-bitbucket-pipe@${{ steps.push.outputs.digest }}"

  github-release:
    name: create the GitHub release
    needs: [build, publish, confirm]
    # Only for a real tag push. A `workflow_dispatch` verification run must not
    # create a release object for a version that already exists.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success'
      && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: artefacts

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build the VS Code extension
        # Built from the tagged source, tested, and attached beside the wheel; the editor
        # extension and the scanner it runs are released together and carry one version.
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npx --yes @vscode/vsce@3.6.0 package --no-dependencies -o "../../artefacts/cordon-${GITHUB_REF_NAME#v}.vsix"

      - name: Take the notes from the release page
        # docs/releases/<version>.md is the release written for a reader: the
        # same ASCII-diagram form as the READMEs, linking the full CHANGELOG
        # section for every change. tests/unit/test_release_notes.py holds CI
        # to it existing for the version being cut, so a missing page fails a
        # pull request, not a release.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          page="docs/releases/${version}.md"
          if [ ! -s "$page" ]; then
            echo "::error::${page} is missing; write the release page before tagging"
            exit 1
          fi
          cp "$page" notes.md
          head -8 notes.md

      - name: Publish it
        # The wheel and sdist are attached as well as being on PyPI: a release
        # page that carries the artefacts is what a signature is verified
        # against, and cosign has already signed these.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            artefacts/dist/* artefacts/*.vsix \
            || gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

  vscode-marketplace:
    name: publish the VS Code extension to the Marketplace and Open VSX
    # The `threx-code` publisher was unclaimed on both registries, so anyone could have taken it and
    # shipped an extension under the name `/connect` tells people to search for (audit PK-08, FE-02).
    # Published only from a tag, only after the GitHub release exists, from the very .vsix attached to
    # it (attested here), and with tokens held in a protected environment that needs a reviewer.
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Fetch the released .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir vsix
          ls -l vsix

      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: vsix/*.vsix

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Publish
        # Each registry is skipped, with a notice, until its token is configured: a release must not
        # fail because a namespace has not been claimed yet, and the notice says it has not.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          package="$(ls vsix/*.vsix)"
          if [ -n "${VSCE_PAT}" ]; then
            npx --yes @vscode/vsce@3.6.0 publish --packagePath "$package"
          else
            echo "::notice::VSCE_PAT is not set; the Marketplace was not published to"
          fi
          if [ -n "${OVSX_PAT}" ]; then
            npx --yes ovsx@1.2.0 publish "$package" --pat "${OVSX_PAT}"
          else
            echo "::notice::OVSX_PAT is not set; Open VSX was not published to"
          fi
