# The platform wheels: the scanner with its own C extensions compiled in, for every supported
# interpreter on Linux (x86_64, aarch64), macOS (arm64, x86_64) and Windows (x64).
#
# Called by `ci.yml` on every pull request, so a change that breaks a platform's native build is
# seen before merge, and by `release.yml`, which publishes exactly the wheels built here beside the
# pure wheel. Every wheel is built with `CORDON_BUILD_NATIVE=require` (a wheel meant to be native
# cannot quietly come out pure), installed into a fresh environment, checked to load the native
# matcher, and run against the rule-engine tests from that installed copy.
#
# Nothing third-party joins the build: the compiler is the platform's own (the manylinux image's
# gcc, Xcode's clang, MSVC found by vswhere), the backend is `scripts/backend/cordon_build.py`, and
# every image and action is pinned by digest. A manylinux tag is a promise about glibc; the build
# runs inside the image whose glibc that tag names, and `auditwheel show` confirms it.

name: native-wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:43f7ce12d79ed98b6dbfa3291d5afe389efd40a7e76de089959ffe99501b6edf
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:724b504247662e1cf122590957c857211ec2d16b113ec134f92c570a2d01250f
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build, audit and test each interpreter's wheel
        env:
          CORDON_BUILD_NATIVE: require
          CORDON_WHEEL_PLATFORM: manylinux_2_28_${{ matrix.arch }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct 2>/dev/null || echo 315532800)
          for py in cp311-cp311 cp312-cp312 cp313-cp313; do
            python=/opt/python/$py/bin/python
            $python -c "import sys; sys.path.insert(0, 'scripts/backend'); import cordon_build; print(cordon_build.build_wheel('wheelhouse'))"
            wheel=$(ls wheelhouse/*-$py-manylinux_2_28_${{ matrix.arch }}.whl)
            auditwheel show "$wheel"
            $python -m venv /tmp/venv-$py
            /tmp/venv-$py/bin/pip install -q --require-hashes -r ci/dev-requirements.txt
            /tmp/venv-$py/bin/pip install -q --no-deps "$wheel"
            (cd /tmp && /tmp/venv-$py/bin/python -I -c "from cordon_scanner.detect.binary.rule_engine.automaton import Automaton as A; assert A.NATIVE, A.WHY; print(A.WHY)")
            /tmp/venv-$py/bin/python -m pytest -q -p no:cacheprovider tests/unit/detect/binary/rule_engine
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl

  macos:
    name: macos ${{ matrix.arch }}, python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        python: ["3.11", "3.12", "3.13"]
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and test the wheel
        env:
          CORDON_BUILD_NATIVE: require
          # One architecture per wheel, named in its tag; 11.0 is the oldest macOS on arm64 and
          # the floor set for both, passed to the compiler as -mmacosx-version-min.
          ARCHFLAGS: -arch ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          python -c "import sys; sys.path.insert(0, 'scripts/backend'); import cordon_build; print(cordon_build.build_wheel('wheelhouse'))"
          wheel=$(ls wheelhouse/*-macosx_11_0_${{ matrix.arch }}.whl)
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --require-hashes -r ci/dev-requirements.txt
          /tmp/venv/bin/pip install -q --no-deps "$wheel"
          (cd /tmp && /tmp/venv/bin/python -I -c "from cordon_scanner.detect.binary.rule_engine.automaton import Automaton as A; assert A.NATIVE, A.WHY; print(A.WHY)")
          /tmp/venv/bin/python -m pytest -q -p no:cacheprovider tests/unit/detect/binary/rule_engine
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-macos-${{ matrix.arch }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  windows:
    name: windows x64, python ${{ matrix.python }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Build the wheel with MSVC
        # The runner's own Visual Studio, found by its own locator; no action fetches a compiler.
        shell: cmd
        env:
          CORDON_BUILD_NATIVE: require
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          for /f %%t in ('git log -1 --pretty^=%%ct') do set SOURCE_DATE_EPOCH=%%t
          python -c "import sys; sys.path.insert(0, 'scripts/backend'); import cordon_build; print(cordon_build.build_wheel('wheelhouse'))"
      - name: Test the wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls wheelhouse/*-win_amd64.whl)
          python -m venv venv
          venv/Scripts/pip install -q --require-hashes -r ci/dev-requirements.txt
          venv/Scripts/pip install -q --no-deps "$wheel"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/venv/Scripts/python" -I -c "from cordon_scanner.detect.binary.rule_engine.automaton import Automaton as A; assert A.NATIVE, A.WHY; print(A.WHY)")
          venv/Scripts/python -m pytest -q -p no:cacheprovider tests/unit/detect/binary/rule_engine
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-windows-${{ matrix.python }}
          path: wheelhouse/*.whl
