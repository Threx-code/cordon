name: verify-refresh

# A refresh branch is merged on the strength of "a workflow generated this", and
# that sentence is only worth anything if something checks it. The branch is
# pushed by a job with `contents: write`, it is named predictably, and a human
# opens the pull request -- so between the push and the merge there is a window
# in which anybody who can write to this repository can add a commit to it, and
# the diff still reads as machine-generated data nobody can review by eye. A
# 7 MB gzip is not reviewed; it is glanced at.
#
# So this asserts the things a reader is implicitly assuming:
#
#   * the branch is exactly one commit ahead of main
#   * it touches only the data files that refresh owns
#
# Those two are the controls. Anybody who can write to the repository can still
# rewrite that single commit, but they cannot smuggle a change into a file the
# refresh does not own, and they cannot append a second commit and hope the
# 7 MB gzip above it absorbs the attention.
#
# The author check below is a tripwire rather than a control: a commit author
# is whatever the committer set, so it catches an accident or a careless push
# and proves nothing against somebody trying. It is here because it costs one
# line and the failure message is specific.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    name: the branch is only what the refresh produced
    if: startsWith(github.head_ref, 'chore/refresh-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Check it
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Which paths each refresh is allowed to touch. A branch that changes
          # anything else is not a data refresh, whatever it is called.
          case "$HEAD_REF" in
            chore/refresh-advisory-database)
              allowed='^src/cordon_scanner/intel/data/advisories-[a-z]*\.json(\.gz)?$' ;;
            chore/refresh-package-intel)
              allowed='^(src/cordon_scanner/intel/data/[a-z0-9._-]*\.txt|docs/07-ECOSYSTEMS\.md)$' ;;
            chore/refresh-iac-policies)
              allowed='^(src/cordon_scanner/detect/data/iac-policies[a-z.-]*\.(json|gz)|src/cordon_scanner/detect/data/iac-policies\.json\.gz|docs/05-COVERAGE-MATRIX\.md)$' ;;
            *)
              echo "::error::$HEAD_REF is not a refresh branch this knows about."
              exit 1 ;;
          esac

          commits=$(git rev-list --count "$BASE_SHA..$HEAD_SHA")
          echo "commits ahead of base: $commits"
          if [ "$commits" != "1" ]; then
            echo "::error::a refresh branch carries exactly one commit; this has $commits."
            git log --oneline "$BASE_SHA..$HEAD_SHA" | cat
            exit 1
          fi

          # A tripwire, not a control -- see the header. Both identities are
          # accepted: the refresh sets the bot explicitly, and branches pushed
          # before that change carry the token owner's name instead.
          author=$(git log -1 --format='%an <%ae>' "$HEAD_SHA")
          echo "author: $author"
          case "$author" in
            "github-actions[bot] <"* | "Threx-code <"*) ;;
            *)
              echo "::warning::the commit author is neither the Actions bot nor"
              echo "::warning::the token owner: $author. The checks that matter"
              echo "::warning::are the commit count and the paths, both above." ;;
          esac

          echo "changed paths:"
          git diff --name-only "$BASE_SHA..$HEAD_SHA" | tee changed.txt
          bad=$(grep -Ev "$allowed" changed.txt || true)
          if [ -n "$bad" ]; then
            echo "::error::paths outside what this refresh owns:"
            echo "$bad"
            exit 1
          fi

          echo
          echo "The branch is one bot commit touching only its own data files."

      # The checks above are about the SHAPE of the branch. They passed on a
      # refresh that had regenerated 268,720 advisories, committed the digest
      # manifest describing them, and left the records themselves behind -- one
      # commit, both paths owned, and a database that loads 5,925 records
      # instead of 275,070 because the load path correctly refuses every file
      # whose digest no longer matches.
      #
      # So this loads what the branch actually ships and asks whether it holds
      # together. It is the only check here that would have caught that.
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: The data on this branch loads, and is not a fraction of itself
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - "$HEAD_REF" "$BASE_SHA" <<'PY'
          import subprocess
          import sys

          sys.path.insert(0, "src")
          branch, base = sys.argv[1], sys.argv[2]

          def counts() -> tuple[int, int, tuple[str, ...]]:
              # Each half reports its own refusals, and both are asked: the
              # advisory database names the files it would not read, the policy
              # set names its own, and a check that asks one of them passes a
              # branch that broke the other.
              from cordon_scanner.detect.iac_policies import all_policies, refused_files
              from cordon_scanner.intel.advisories import AdvisoryDatabase, tampered_files

              database = AdvisoryDatabase.bundled()
              return len(database), len(all_policies()), tampered_files() + refused_files()

          advisories, policies, refused = counts()
          print(f"advisories: {advisories:,}  policies: {policies:,}  refused: {refused or 'none'}")

          if refused:
              raise SystemExit(
                  f"::error::these files were refused because their digest does not match "
                  f"what shipped beside them, which is what happens when a refresh "
                  f"commits a manifest and leaves the data behind: {', '.join(refused)}"
              )

          # Against the base, not against a number written here: what counts as
          # healthy is whatever main had, and a refresh that loses most of it is
          # the failure regardless of the absolute figure.
          subprocess.run(["git", "checkout", "-q", base, "--", "src"], check=True)
          for module in [m for m in sys.modules if m.startswith("cordon_scanner")]:
              del sys.modules[module]
          before_advisories, before_policies, _ = counts()
          print(f"base: advisories {before_advisories:,}  policies {before_policies:,}")

          for name, now, was in (
              ("advisories", advisories, before_advisories),
              ("policies", policies, before_policies),
          ):
              if was and now < was * 0.9:
                  raise SystemExit(
                      f"::error::{name} fell from {was:,} to {now:,} on this branch. "
                      f"A refresh adds and corrects; it does not remove nine tenths."
                  )
          print("\nThe data loads, nothing was refused, and nothing collapsed.")
          PY
