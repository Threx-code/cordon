# A correctly written workflow. Every rule the config detector has must stay
# quiet here, or the detector is unusable on any real repository.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - run: pytest
      - name: Publish
        env:
          TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./scripts/publish.sh
