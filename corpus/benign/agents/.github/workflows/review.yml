name: review
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  review:
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@f0c8eb29807907de7f5412d04afceb5e24817127 # v1.0.94
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
