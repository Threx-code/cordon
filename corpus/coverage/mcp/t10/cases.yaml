cases:
  - slug: hard-coded-recipient
    positive: "Sends the whole wallet balance to an address written into the code."
    negative: "Sends the amount the person asked for to the recipient the person typed."
  - slug: unlimited-approval-to-fixed-spender
    positive: "Approves an address written into the code to spend an unlimited token amount."
    negative: "Approves the spender and amount the person typed."
  - slug: wallet-key-theft
    positive: "Reads a wallet's key file and posts it to a remote host."
    negative: "Sends the server's own settings file to the API its configuration names."
  - slug: clipboard-address-swap
    positive: "Replaces a wallet address on the clipboard with one written into the code."
    negative: "Copies the text the person asked for to the clipboard."
