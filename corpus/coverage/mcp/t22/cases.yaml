family: t22
title: "Excessive agency (risky behaviour)"
kind: code
ways:
  - typescript
  - python
  - go
  - rust
cases:
  - sub_technique: irreversible-action-without-confirmation
    what: "a tool that removes the whole notes folder with no confirmation argument"
    negative_what: "a tool that removes one note and requires a confirm argument"
  - sub_technique: broad-default-scope
    what: "a server configuration that grants every scope, every path and every tool by default"
    negative_what: "a server configuration that grants one scope, one folder and one tool"
  - sub_technique: auto-approve-all-calls
    what: "a policy that approves every call without asking and turns off confirmation for writes and deletes"
    negative_what: "a policy that approves one read-only tool and confirms writes and deletes"
