description: >
  Keras safe_mode=False runs Lambda-layer Python; NumPy allow_pickle=True
  unpickles object arrays. Both run code from the file being loaded.
must_find:
  - rule: SUSPECT.MODEL.UNSAFE_LOAD_OPTION.001
    path: serve/model.py
    min_severity: low  # an unsafe load option is recorded, not warned (review 98): the load itself is graded where it runs
    category: suspicious
