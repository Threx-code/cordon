description: >
  The obfuscated-loader script run by a `preinstall` hook, in a package directory whose name
  contains the word `samples`. The name is not evidence of a fixture; the hook is evidence the file
  runs on every install.
must_find:
  - rule: SUSPECT.INSTALL.SCRIPT.001
    path: @innocuous-data-samples/package/package.json
    min_severity: low  # the hook runs index.js, graded on its own: MALWARE.EXFIL.001 below
  - rule: MALWARE.EXFIL.001
    path: @innocuous-data-samples/package/index.js
    min_severity: critical
