[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cordon-model-server"
version = "0.7.0"
description = "Serves a signed Cordon detection model to Cordon scanners over HTTPS."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# cordon-scanner provides the feature layout and the Ed25519 verifier; it is installed beside this
# at the same version (see Dockerfile).
dependencies = ["numpy==2.1.3", "scipy==1.14.1", "lightgbm==4.5.0", "scikit-learn==1.5.2"]

[project.scripts]
cordon-model-server = "cordon_model_server.__main__:Main.run"

[tool.setuptools.packages.find]
include = ["cordon_model_server*"]
