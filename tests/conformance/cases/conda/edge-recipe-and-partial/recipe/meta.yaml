{% set name = "fastparse" %}
{% set version = "0.4.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/f/fastparse/fastparse-{{ version }}.tar.gz
  sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - cmake >=3.24
  host:
    - python
    - pip
    - cython >=3.0
  run:
    - python >=3.9
    - numpy >=1.22
    - libxml2 2.12.*  # [linux]
    - pywin32  # [win]

test:
  requires:
    - pytest >=8
  imports:
    - fastparse
