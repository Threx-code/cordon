# Cargo.lock version 1 (Cargo before 1.41): checksums in a [metadata] table, edges written
# "name version (source)". Still in old repositories; read like the current formats.
kinds: [edge, valid, regression]
covers:
  - cargo.lock-versions
  - cargo.checksums
  - UNI-30
dependencies:
  - {name: itoa, resolved_version: 1.0.11, integrity_status: recorded, direct: true, dependency_path: [itoa]}
  - {name: memchr, integrity: 78ca9ab1a0babb1e7d5695e3530886289c18cf2f87ec19a575a0abdce112e3a3}
absent:
  - legacy-app
no_findings:
  - POLICY.LOCKFILE.INTEGRITY.001
  - POLICY.DEPENDENCY.INTEGRITY.001
