---
- name: Add the vendor signing key
  ansible.builtin.copy:
    src: files/vendor.asc
    dest: /etc/apt/trusted.gpg.d/vendor.asc
    mode: "0644"

- name: Install python3-debian
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: "{{ item }}"
  ansible.builtin.debug:
    msg: done
  loop: [one]
