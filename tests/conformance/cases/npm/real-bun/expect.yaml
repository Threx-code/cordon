# Bun 1.2's text lockfile, written by Bun, with a workspace.
kinds: [real-world, valid]
covers:
  - file:bun.lock
  - npm.bun
  - npm.workspaces
dependencies:
  - {name: chalk, resolved_version: 4.1.2, direct: true}
  - {name: fsevents, dependency_type: optional, platform_constraints: ["os: darwin"]}
  - {name: left-pad, dependency_type: dev, direct: true}
  - {name: local-util, source_type: path, resolved_version: 0.1.0}
  - {name: ms, resolved_version: 2.1.3, direct: true}
  - {name: ansi-styles, dependency_path: [chalk, ansi-styles]}
