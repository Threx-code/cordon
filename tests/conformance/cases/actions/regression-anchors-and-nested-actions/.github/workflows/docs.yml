name: docs
on: push
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - &CHECKOUT
        name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make docs
  l10n:
    runs-on: ubuntu-latest
    steps:
      - *CHECKOUT
      - run: make l10n
