# A Conan 2 workspace: conanws.yml lists two packages developed together, libb depends on liba
# (the workspace's own code, so in no lock), and one lock at the root resolves both. zlib, which
# both require, is one package.
kinds: [edge, valid]
covers:
  - conan.recipes
  - UNI-07
  - UNI-09
dependencies:
  - {name: zlib, resolved_version: 1.3.1, direct: true, lockfile_location: {path: conan.lock}}
  - {name: fmt, resolved_version: 10.2.1, manifest_location: {path: libb/conanfile.py}, lockfile_location: {path: conan.lock}}
  - {name: liba, source_type: path, manifest_location: {path: libb/conanfile.py}}
sources:
  - "workspace packages liba, libb"
