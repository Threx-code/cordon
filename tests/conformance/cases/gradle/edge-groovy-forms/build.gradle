// The root build: a buildscript classpath, values shared through `ext`, and repositories for
// every project -- one of them over plain HTTP.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
    }
}

ext {
    kotlinVersion = '1.9.24'
}

allprojects {
    repositories {
        mavenCentral()
        maven { url 'http://maven.legacy.example.internal/releases' }
    }
}
