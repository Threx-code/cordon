[project]
name = "conformance-app"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = [
  "requests[socks]==2.32.3",
  "colorama==0.4.6; sys_platform == 'win32'",
  "packaging>=24.0",
]

[project.optional-dependencies]
yaml = ["pyyaml==6.0.2"]

[dependency-groups]
test = ["iniconfig==2.0.0"]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"
