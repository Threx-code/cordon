# Cordon supply-chain scanning for GitLab CI.
#
# Include it at the tag of the version you want, so the template and the scanner move together:
#   include:
#     - remote: 'https://raw.githubusercontent.com/Threx-code/cordon/v0.7.0/ci/gitlab/cordon.gitlab-ci.yml'
#
# The scanner is installed hash-verified: pip refuses anything whose digest is not in the pin
# committed at that tag, so a compromised index cannot swap the scanner. A tag with no pin fails
# the job rather than installing an unverified scanner.
#
# Upload to Cordon Cloud by setting CORDON_UPLOAD to "true". The job's own OIDC token (audience
# `cordon`) is exchanged for a fifteen-minute Cordon token; no secret is stored in GitLab.

.cordon:
  image: python:3.12-slim
  variables:
    CORDON_VERSION: "0.7.0"
    CORDON_SEVERITY: "low"
    CORDON_FAIL_ON: "high"
    CORDON_UPLOAD: "false"
    # "scan" (the default) or "decide": decide runs `cordon-scanner decide --lock --point ci_gate` over the
    # JSON question in CORDON_DECIDE_QUESTION (compiled policy, locked artifacts, their evidence, the time).
    CORDON_MODE: "scan"
    CORDON_DECIDE_QUESTION: ""
  id_tokens:
    CORDON_ID_TOKEN:
      aud: cordon
    # Sigstore's own audience, for signing the upload with this job's identity.
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends curl ca-certificates >/dev/null
    - echo "$CORDON_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "CORDON_VERSION is not a version"; exit 3; }
    - curl -fsSLo cordon-requirements.txt "https://raw.githubusercontent.com/Threx-code/cordon/v${CORDON_VERSION}/action/requirements.txt"
    - python -m pip install --quiet --disable-pip-version-check --require-hashes --no-deps -r cordon-requirements.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - cordon.sarif
      - cordon-result.json
      - cordon-decision.json
    reports:
      junit: cordon-junit.xml
      codequality: gl-code-quality-report.json

cordon:scan:
  extends: .cordon
  stage: test
  script:
    - |
      if [ "$CORDON_MODE" = "decide" ]; then
        [ -n "$CORDON_DECIDE_QUESTION" ] || { echo "decide mode needs CORDON_DECIDE_QUESTION"; exit 3; }
        cordon-scanner decide --lock --point ci_gate < "$CORDON_DECIDE_QUESTION" > cordon-decision.json
        exit $?
      fi
      set -- scan . --severity "$CORDON_SEVERITY" --fail-on "$CORDON_FAIL_ON" --no-color \
        --format text \
        --format sarif:cordon.sarif \
        --format json:cordon-result.json \
        --format junit:cordon-junit.xml \
        --format codeclimate:gl-code-quality-report.json
      [ "$CORDON_UPLOAD" = "true" ] && set -- "$@" --upload
      cordon-scanner "$@"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# On a merge request: what the dependency update adds, compared with the merge request's base. Each change that
# blocks is a Code Quality entry titled with its reason code (R100, R404, R400, R401), at the lockfile that declares
# it, shown in the merge request's widget; the job fails when any change blocks. Set CORDON_REVIEW_ONLINE to "true"
# to also fetch each changed package's old and new releases, verify and compare them.
cordon:dependency-review:
  extends: .cordon
  stage: test
  variables:
    CORDON_REVIEW_ONLINE: "false"
    GIT_DEPTH: "0"
  script:
    - |
      echo "$CI_MERGE_REQUEST_DIFF_BASE_SHA" | grep -Eq '^[0-9a-f]{40}([0-9a-f]{24})?$' || { echo "no merge request base"; exit 3; }
      set -- review . --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --format codeclimate --quiet
      [ "$CORDON_REVIEW_ONLINE" = "true" ] && set -- "$@" --online
      cordon-scanner "$@" > gl-code-quality-review.json
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      codequality: gl-code-quality-review.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# For a runner with no internet access: extend this instead. The image must already carry the
# scanner (installed from the release wheel and its hash pin, mirrored internally) and a signed
# intel bundle from `cordon-scanner bundle install`. CORDON_OFFLINE stops the feed fetch entirely.
.cordon-airgapped:
  extends: .cordon
  variables:
    CORDON_OFFLINE: "1"
  before_script:
    - cordon-scanner --version
