# Cordon supply-chain scanning for GitLab CI.
#
# Include it at the tag of the version you want, so the template and the scanner move together:
#   include:
#     - remote: 'https://raw.githubusercontent.com/Threx-code/cordon/v0.5.1/ci/gitlab/cordon.gitlab-ci.yml'
#
# The scanner is installed hash-verified: pip refuses anything whose digest is not in the pin
# committed at that tag, so a compromised index cannot swap the scanner. A tag with no pin fails
# the job rather than installing an unverified scanner.
#
# Upload to Cordon Cloud by setting CORDON_UPLOAD to "true". The job's own OIDC token (audience
# `cordon`) is exchanged for a fifteen-minute Cordon token; no secret is stored in GitLab.

.cordon:
  image: python:3.12-slim
  variables:
    CORDON_VERSION: "0.5.1"
    CORDON_SEVERITY: "low"
    CORDON_FAIL_ON: "high"
    CORDON_UPLOAD: "false"
  id_tokens:
    CORDON_ID_TOKEN:
      aud: cordon
    # Sigstore's own audience, for signing the upload with this job's identity.
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends curl ca-certificates >/dev/null
    - echo "$CORDON_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "CORDON_VERSION is not a version"; exit 3; }
    - curl -fsSLo cordon-requirements.txt "https://raw.githubusercontent.com/Threx-code/cordon/v${CORDON_VERSION}/action/requirements.txt"
    - python -m pip install --quiet --disable-pip-version-check --require-hashes --no-deps -r cordon-requirements.txt
    - |
      if [ "$CORDON_UPLOAD" = "true" ]; then
        curl -fsSLo cordon-attest.txt "https://raw.githubusercontent.com/Threx-code/cordon/v${CORDON_VERSION}/action/requirements-attest.txt"
        python -m pip install --quiet --disable-pip-version-check --require-hashes --no-deps -r cordon-attest.txt
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - cordon.sarif
      - cordon-result.json
    reports:
      junit: cordon-junit.xml
      codequality: gl-code-quality-report.json

cordon:scan:
  extends: .cordon
  stage: test
  script:
    - |
      set -- scan . --severity "$CORDON_SEVERITY" --fail-on "$CORDON_FAIL_ON" --no-color \
        --format text \
        --format sarif:cordon.sarif \
        --format json:cordon-result.json \
        --format junit:cordon-junit.xml \
        --format codeclimate:gl-code-quality-report.json
      [ "$CORDON_UPLOAD" = "true" ] && set -- "$@" --upload
      cordon-scanner "$@"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# For a runner with no internet access: extend this instead. The image must already carry the
# scanner (installed from the release wheel and its hash pin, mirrored internally) and a signed
# intel bundle from `cordon-scanner bundle install`. CORDON_OFFLINE stops the feed fetch entirely.
.cordon-airgapped:
  extends: .cordon
  variables:
    CORDON_OFFLINE: "1"
  before_script:
    - cordon-scanner --version
