# Cordon supply-chain scanning for Azure Pipelines.
#
# Use it as a template from a repository resource pinned to a release tag:
#   resources:
#     repositories:
#       - repository: cordon
#         type: github
#         name: Threx-code/cordon
#         ref: refs/tags/v0.5.1
#         endpoint: github
#   steps:
#     - template: ci/azure/cordon-task.yml@cordon
#
# The scanner is installed hash-verified from the pin committed at that tag. To upload, set
# `upload: true` and `serviceConnectionId` to the id of a workload identity service connection made
# for Cordon (no Azure role assignments; restrict it to your default branch with a branch control
# check). The job asks Azure DevOps for that connection's OIDC token; Cordon exchanges it, and the
# trust rule pins the connection. No secret is stored.

parameters:
  - name: severity
    type: string
    default: low
  - name: failOn
    type: string
    default: high
  - name: upload
    type: boolean
    default: false
  - name: serviceConnectionId
    type: string
    default: ""
  - name: version
    type: string
    default: "0.5.1"
  - name: workingDirectory
    type: string
    default: $(Build.SourcesDirectory)

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"

  - script: |
      set -eu
      echo "$CORDON_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version is not a version"; exit 3; }
      curl -fsSLo "$(Agent.TempDirectory)/cordon-requirements.txt" \
        "https://raw.githubusercontent.com/Threx-code/cordon/v${CORDON_VERSION}/action/requirements.txt"
      python -m pip install --quiet --disable-pip-version-check --require-hashes --no-deps \
        -r "$(Agent.TempDirectory)/cordon-requirements.txt"
    displayName: Install Cordon (hash-verified)
    env:
      CORDON_VERSION: ${{ parameters.version }}

  - script: |
      set -- scan . --severity "$CORDON_SEVERITY" --fail-on "$CORDON_FAIL_ON" --no-color \
        --format text \
        --format "junit:$(Build.ArtifactStagingDirectory)/cordon-junit.xml" \
        --format "sarif:$(Build.ArtifactStagingDirectory)/cordon.sarif"
      if [ "$CORDON_UPLOAD" = "True" ]; then
        [ -n "$CORDON_SERVICE_CONNECTION" ] || { echo "upload needs serviceConnectionId"; exit 3; }
        # The service connection's OIDC token, from Azure DevOps itself; never echoed.
        CORDON_ID_TOKEN="$(curl -fsS -X POST -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" -H "Content-Length: 0" \
          "${SYSTEM_OIDCREQUESTURI}?api-version=7.1&serviceConnectionId=${CORDON_SERVICE_CONNECTION}" \
          | python -c "import json,sys; print(json.load(sys.stdin)['oidcToken'])")"
        export CORDON_ID_TOKEN
        set -- "$@" --upload
      fi
      cordon-scanner "$@"
    displayName: Supply-chain scan
    workingDirectory: ${{ parameters.workingDirectory }}
    env:
      CORDON_SEVERITY: ${{ parameters.severity }}
      CORDON_FAIL_ON: ${{ parameters.failOn }}
      CORDON_UPLOAD: ${{ parameters.upload }}
      CORDON_SERVICE_CONNECTION: ${{ parameters.serviceConnectionId }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # Both publish steps run with condition: always(). Publishing only on success
  # hides the results precisely when there are some.
  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: $(Build.ArtifactStagingDirectory)/cordon-junit.xml
      testRunTitle: Cordon supply-chain scan

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/cordon.sarif
      ArtifactName: CodeAnalysisLogs
