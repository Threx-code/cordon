# Cordon supply-chain scanning for Buildkite.
#
# Add this step to your pipeline (or upload it with `buildkite-agent pipeline upload`). The scanner
# is installed hash-verified from the pin committed at the release tag. To upload, set
# CORDON_UPLOAD=true: the agent asks Buildkite for an OIDC token with audience `cordon` for this
# job, Cordon exchanges it, and no secret is stored. The trust rule pins the organisation and the
# pipeline; the token names the branch. Set CORDON_ORGANIZATION to your Cordon organisation id
# (Settings, Organisation): a Buildkite organisation cannot be proven to Cordon, so the job names
# the Cordon organisation it uploads to, and an upload without it is refused.

steps:
  - label: ":shield: Cordon supply-chain scan"
    env:
      CORDON_VERSION: "0.5.1"
      CORDON_SEVERITY: "low"
      CORDON_FAIL_ON: "high"
      CORDON_UPLOAD: "false"
      CORDON_ORGANIZATION: ""
    command: |
      set -eu
      echo "$CORDON_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version is not a version"; exit 3; }
      python3 -m venv .cordon-venv
      curl -fsSLo .cordon-requirements.txt \
        "https://raw.githubusercontent.com/Threx-code/cordon/v${CORDON_VERSION}/action/requirements.txt"
      .cordon-venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --no-deps \
        -r .cordon-requirements.txt
      set -- scan . --severity "$CORDON_SEVERITY" --fail-on "$CORDON_FAIL_ON" --no-color \
        --format text --format junit:cordon-junit.xml --format sarif:cordon.sarif
      if [ "$CORDON_UPLOAD" = "true" ]; then
        [ -n "$CORDON_ORGANIZATION" ] || { echo "upload needs CORDON_ORGANIZATION (Settings, Organisation in Cordon)"; exit 3; }
        CORDON_ID_TOKEN="$(buildkite-agent oidc request-token --audience cordon)"
        export CORDON_ID_TOKEN
        # Keyless signing with this job's identity: the hash-locked sigstore stack and a token
        # for Sigstore's audience.
        curl -fsSLo .cordon-attest.txt \
          "https://raw.githubusercontent.com/Threx-code/cordon/v${CORDON_VERSION}/action/requirements-attest.txt"
        .cordon-venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --no-deps \
          -r .cordon-attest.txt
        SIGSTORE_ID_TOKEN="$(buildkite-agent oidc request-token --audience sigstore)"
        export SIGSTORE_ID_TOKEN
        set -- "$@" --upload
      fi
      .cordon-venv/bin/cordon-scanner "$@"
    artifact_paths:
      - "cordon.sarif"
      - "cordon-junit.xml"
