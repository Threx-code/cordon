name: Cordon supply-chain scan
image: ghcr.io/threx-code/cordon-bitbucket-pipe:0.7.0
category: Security
description: >-
  Scans the repository for malicious packages, install-time behaviour, exposed secrets, CI and
  agent-chain risks and known-vulnerable dependencies. Nothing from the repository is executed.
repository: https://github.com/Threx-code/cordon
maintainer:
  name: Cordon
  website: https://github.com/Threx-code/cordon
variables:
  - name: SEVERITY
    default: low
  - name: FAIL_ON
    default: high
  - name: UPLOAD
    default: "false"
    description: Upload results to Cordon Cloud. Add `oidc: true` to the step; no secret is needed.
  - name: DEPENDENCY_REVIEW
    default: "true"
    description: >-
      On a pull request, review what the dependency update adds compared with the destination branch and post it
      to Code Insights; each blocking change is an annotation titled with its reason code.
  - name: DEPENDENCY_REVIEW_ONLINE
    default: "false"
    description: Also fetch each changed package's old and new releases, verify and compare them.
tags:
  - security
  - supply-chain
  - sca
